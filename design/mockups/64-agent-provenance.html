<title>Who is answering</title>
<!--
  64 · WHO IS ANSWERING (29 Sep 2026)
  His ask, verbatim: "I think it would also be excellent to somehow depict
  when different agents are being incorporated and responding directly back
  to nova with specific information. For example if I ask Nova a question
  regarding my training then I should be able to somehow see and know that
  coach is doing its own research and response back to Nova or that coach
  itself is the one providing the answers rather than nova as a whole. On
  the other hand if coach, the librarian and the researcher are all working
  together then I should also be able to see this and know that nova is
  responding from the synthesis of all of these agents. I'm not sure this
  would look like so consider this as a separate build to mock up."

  It lives on the talking screen of mockup 62, variation A (the conversation
  as the page); the tab is labelled Nova. Three variations of the SAME
  scenarios, switched at the top, each with seven screens (#a/1 to #c/7):
    1 Ask     a training question; Nova hands it to the Coach; the Coach works
    2 Coach   the Coach's answer, under its own name and face
    3 Roster  a question for three; nobody back yet
    4 Back    two of the three back, the Researcher still reading
    5 Joint   Nova's synthesis, marked as one, with its three contributors
    6 Open    one contributor's own words, one tap from the synthesis
    7 Alone   the plain case: Nova answers by herself
  A · Bylines   every message carries its author (face, name, hue)
  B · Bench     a strip above the composer shows who is on the bench
  C · Stage     the consult is acted out on the running-glass stage

  WHAT IT MAY SHOW. Only what code could know: which lane answered, which
  consults were made and came back, in what order, how long each took, and
  what code handed each agent (coachTurn.js names every context section and
  every one that failed to load). No agent is drawn doing something its lane
  cannot do. Nova's hand-over lines ("This is the Coach's. Asking it now.")
  are written by code from the ask list, never by a model, so the claim of
  who was asked is a fact. The one model claim on the page is inside the
  synthesis text, where Nova names whose finding shaped a sentence
  (consultReplyText already asks the Coach to do this).

  Colour: each agent's hue means that agent and nothing else on this page:
  Coach coral (--nv-m-chest), the Researcher blue (--nv-m-quads), the
  Librarian teal (--nv-m-back), the three hues beings.js already gave them.
  Nova has no hue; her mark is the orb. Cyan stays the talk action (the Nova
  button) as in 62; gold stays "waiting on you" (unused here). Nothing is
  said by colour alone: every agent is also its name, its face (Coach's two
  eyes and brows, the Researcher's single lens, the Librarian's crest of
  spines) and its artefact (barbell, page, index card); every state is also a
  word and a shape (a turning ring = working, a tick = back).

  DEMO CONTENT ONLY. The repo is public; nothing here is his data. The
  questions, weights, dates, the book "Stronger Slowly" and every time are
  invented.
-->

/* the composer: one bar, above the tab bar */
.composer{position:fixed;left:12px;right:12px;bottom:calc(var(--dock-h) + env(safe-area-inset-bottom,0px) + 2px);z-index:18;max-width:378px;margin:0 auto;display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:6px;align-items:end;padding:6px;border-radius:28px;background:var(--tab);backdrop-filter:blur(24px) saturate(1.5);-webkit-backdrop-filter:blur(24px) saturate(1.5);box-shadow:0 0 0 .5px var(--tab-ring),0 1px 0 var(--card-hi) inset,0 12px 30px -14px rgba(0,0,0,.5)}

.field{min-height:44px;display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:6px 14px;border-radius:22px;background:var(--well);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ink) 12%,transparent);font:400 15px/1.3 var(--ui);color:var(--ink3);text-align:left}

/* the skeleton and the review notes (as mockup 62) */
.skel{display:block;border-radius:6px;background:linear-gradient(90deg,rgba(255,255,255,.06),rgba(255,255,255,.15),rgba(255,255,255,.06));background-size:200% 100%;animation:shimmer 1.4s linear infinite}

/* review notes, set apart from the page by a dashed edge */
.note{margin:18px 0 0;padding:12px 14px;border-radius:16px;border:1px dashed color-mix(in srgb,var(--ink) 26%,transparent);font:400 13px/1.5 var(--ui);color:var(--ink2)}

/* ================= 64 · who is answering ================= */

/* each agent's hue, copied from src/index.css (the hues src/agentWorld/beings.js gave them) */
body[data-m="nova-glass"]{--coach:#ff8a7a;--researcher:#7ab8ff;--librarian:#4fd1c5}

.face{--h:var(--ink2);position:relative;display:inline-block;width:var(--s,28px);height:var(--s,28px);flex:none}
.face svg{width:100%;height:100%;display:block;overflow:visible}
.face .shell{fill:color-mix(in srgb,var(--h) 34%,#0a0f1f);stroke:color-mix(in srgb,var(--h) 72%,transparent);stroke-width:1.5}

.face.work::before{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid color-mix(in srgb,var(--h) 20%,transparent);border-top-color:var(--h);animation:spin 1.4s linear infinite}

.face.h-researcher.work .art{animation:pageturn 2.2s var(--ease) infinite}
@keyframes artlift{from{transform:translateY(1.2px)}to{transform:translateY(-1.6px)}}

.orb.o24{width:24px;height:24px;flex:none}
.orb.o30{width:30px;height:30px;flex:none}

/* A · the byline: face + name + what code knows */
.by{display:flex;align-items:center;gap:8px;min-height:28px;font:600 15px var(--ui)}

.clock{margin-left:auto;font:600 13px var(--round);font-variant-numeric:tabular-nums;color:var(--ink3)}

.seat{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:14px 6px 10px;border-radius:20px;background:color-mix(in srgb,var(--h) 6%,rgba(255,255,255,.04));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--h) 24%,transparent)}

.view.benched{padding-bottom:calc(var(--dock-h) + env(safe-area-inset-bottom,0px) + 150px)}

.from .fh{display:flex;align-items:center;gap:8px;width:100%;min-height:48px;padding:0 10px 0 8px;font:600 15px var(--ui);text-align:left}
.from .fh .nm{color:var(--h)}

.from .fh .ic{color:var(--ink3);width:16px;height:16px}

.from .fb .read{margin-top:8px}
.from.open{animation:said .34s var(--ease) both}

/* C · the stage: a panel per agent rises as it starts and fills as it returns */
.stg{margin-top:12px;padding:12px;border-radius:26px;background:color-mix(in srgb,var(--ink) 4%,transparent);box-shadow:inset 0 0 0 1px var(--sep)}

.panels.n3{grid-template-columns:repeat(3,minmax(0,1fr))}
.pan{position:relative;display:flex;flex-direction:column;gap:6px;width:100%;padding:12px 10px 12px;border-radius:20px;min-height:204px;text-align:left;background:color-mix(in srgb,var(--h) 8%,var(--card));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--h) 34%,transparent),0 1px 0 var(--card-hi) inset,var(--card-shadow);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));animation:panrise .44s var(--ease) both;animation-delay:calc(var(--i,0) * 90ms)}

.pan .pn{font:600 15px var(--ui);color:var(--h)}
.pan .ps{font:600 13px var(--ui);color:var(--ink3);font-variant-numeric:tabular-nums}

.joint .jh{display:flex;align-items:center;gap:0}

.joint .jh .jl{margin-left:6px;font:600 15px var(--ui)}

.glasskey .gk{font:600 13px var(--ui);color:var(--ink3)}
.glasskey .gv{margin-top:4px;font:700 34px/1.1 var(--round);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.glasskey .gs{margin-top:4px;font:400 15px var(--ui);color:var(--ink2)}

.note h3{margin:0 0 4px;font:600 13px var(--ui);color:var(--ink)}

@media (prefers-reduced-motion:reduce){

    '<div class="thread rise" style="--i:3">'+you(Q2,'08:20')+jointC()+'</div>'+idleComposer},
   {n:'Open',tally:'<b>C · 6 Open.</b> A face on the card sends that panel back up onto the stage, full size, with its own words, what Nova asked it and the brief · it came from the stage and returns there; the card dims under it',
    html:toprow+turn()+stage('On the glass · the Researcher’s own answer','','<div class="panels"><div class="pan wide done h-researcher" style="animation-name:panrise"><div class="ptop">'+face('researcher',52,'back')+'<div><span class="pn">Researcher</span><br><span class="ps">Asked by Nova · 2 min 41 s</span></div><button class="iconbtn" aria-label="Close">'+ico('x')+'</button></div><span class="meta">Nova asked: '+ASKED.researcher+'</span><p class="pf" style="margin:2px 0 0">'+W.researcher+'</p><button class="erow" style="margin-top:6px">'+ico('doc')+'<span class="t">The cited brief</span><span class="s">Inbox '+ico('right')+'</span></button></div></div>')+
    '<div class="thread rise" style="--i:3"><div class="dim">'+jointC('researcher')+'</div></div>'+idleComposer},
   {n:'Alone',tally:'<b>C · 7 Alone.</b> Nova alone uses the glass as she does today: her own card (the figure she is saying), with no face on it and no panel · no agent panel ever rises for a question she answers herself',
    html:toprow+turn()+stage('On the glass','','<div class="panels"><div class="glasskey"><div class="gk">Wednesday</div><div class="gv">09:00</div><div class="gs">Dentist · nothing else before midday</div></div></div>')+
    '<div class="thread rise" style="--i:3">'+you(Q3,'08:25')+nova('Nine in the morning. Nothing else is booked before midday.')+'<span class="meta nmeta">08:25</span></div>'+idleComposer}
  ]};

  /* ---------- the switcher (as mockup 62) ---------- */
  const phone=$('#phone');
  Object.keys(S).forEach((v)=>S[v].forEach((sc,i)=>{const m=document.createElement('main');m.id=v+(i+1);m.className='view'+(sc.bench?' benched':'');m.hidden=true;m.dataset.tally=sc.tally;m.dataset.scroll=sc.scroll?'1':'';m.innerHTML=sc.html;phone.appendChild(m);}));
  const sw=$('.switch'),scr=$('#screens'),tally=$('#tally');
  const setH=()=>document.documentElement.style.setProperty('--switch-h',(sw.offsetHeight-(parseFloat(getComputedStyle(sw).paddingTop)||0)+8)+'px');
  function renderTally(){const full=tally.dataset.full||'';
    if(tally.classList.contains('open')){tally.innerHTML=full+' <span class="tm">less</span>';return;}
    tally.innerHTML=full;if(tally.scrollWidth<=tally.clientWidth+1)return;
    const tmp=document.createElement('div');tmp.innerHTML=full;const words=tmp.textContent.split(' ');
    while(words.length>1){words.pop();tally.innerHTML=words.join(' ').replace(/[\s,.;:·]+$/,'')+'… <span class="tm">more</span>';if(tally.scrollWidth<=tally.clientWidth+1)break;}}
  tally.addEventListener('click',()=>{tally.classList.toggle('open');renderTally();setH();});
  let v='a',s=1;
  function apply(){
    const main=document.getElementById(v+s);
    $$('main.view').forEach((m)=>{m.hidden=m!==main;});
    $$('[data-var]').forEach((b)=>b.setAttribute('aria-pressed',String(b.dataset.var===v)));
    scr.innerHTML=S[v].map((x,i)=>'<button data-s="'+(i+1)+'" aria-pressed="'+(i+1===s)+'">'+x.n+'</button>').join('');
    tally.dataset.full=main.dataset.tally;tally.classList.remove('open');
    history.replaceState(null,'','#'+v+'/'+s);
    try{localStorage.setItem('nova-agents-64',v+'/'+s);}catch(e){}
    renderTally();setH();
    $$('.rise,.pan,.said.enter,.joint,.bench,.sheet,.from.open,.glasskey',main).forEach((el)=>{el.style.animation='none';void el.offsetWidth;el.style.animation='';});
    window.scrollTo(0,main.dataset.scroll?document.body.scrollHeight:0);
  }
  scr.addEventListener('click',(e)=>{const b=e.target.closest('[data-s]');if(!b)return;s=+b.dataset.s;apply();});
  $$('[data-var]').forEach((b)=>b.addEventListener('click',()=>{v=b.dataset.var;s=1;apply();}));
  function fromHash(){const h=(location.hash||'').replace('#','').toLowerCase();const p=h.split('/');if(!S[p[0]])return false;v=p[0];const n=+p[1];s=n>=1&&n<=S[v].length?n:1;return true;}
  window.addEventListener('hashchange',()=>{if(fromHash())apply();});
  window.addEventListener('resize',()=>{renderTally();setH();});
  if(!fromHash()){try{const p=(localStorage.getItem('nova-agents-64')||'').split('/');if(S[p[0]]){v=p[0];const n=+p[1];s=n>=1&&n<=S[v].length?n:1;}}catch(e){}}
  apply();
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{renderTally();setH();});
})();
</script>
