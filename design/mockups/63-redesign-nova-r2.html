<!--
  63 · NOVA, ROUND 2 (29 Sep 2026)
  His answers to round 1 (mockup 62), in his words: he likes the Nova icon
  "visible and actively working and changing like what it currently is"
  (C), but prefers A and B "for how everything is organised and clearly
  accessible and visible", and asks whether B's stage can join A's
  conversation, with A and B kept here so he can switch between all of
  them. Also his: the tab is relabelled "Nova"; the Nova button is how he
  talks to Nova by voice from any page, and everything from it (the
  exchange, the stage panels, data displays, reports) persists to this
  screen's thread. Decided: a failed transcription keeps the recording so
  Try again resends it; Remember moves into a hold menu on a message.

  Four variations, switched at the top (#a/1 to #e/9):
    A · Thread      mockup 62's A, unchanged except the title and tab (Nova).
    B · Stage       mockup 62's B, unchanged except the title and tab (Nova).
    D · Rising      A's thread is the page. Nova's living core is its face at
                    the head (Messages' contact header, "Nova ›" under it).
                    While she speaks, B's stage rises from under the head as
                    a glass panel over the thread, and settles back into the
                    thread as a card when she finishes.
    E · Header      B's stage is a fixed header, a third of the screen, with
                    the living core large inside it; the thread and composer
                    take the rest; a finished stage pushes into the thread
                    as a card. Scrolling back folds the stage to a bar.
  D and E each draw the six states (your turn, listening, thinking,
  speaking, failed transcription with Try again, offline), a hold menu on a
  message, and a "from the Nova button" screen (he spoke on Fuel; the
  exchange, the stage and the report land in this thread). E adds the
  folded stage.

  The living core is the filament engine from src/NovaCore.jsx, ported to a
  canvas here (same seed, bands, embers, wisps and breathing heart). It
  changes by form, never by hue: it grows with his voice while listening,
  spins (rings three times faster, two arcs chasing) while thinking, and
  pulses with her voice while speaking; grey and still when offline; one
  still frame under reduced motion. Today it tints violet and gold by state;
  here it stays blue, because gold means waiting on his call (his call).

  Colour, as round 1: cyan is the talk action only (the Nova button's ring,
  Send while there is text); gold is waiting on his call (the close); green
  a done receipt; red a failure; every state is also said in words and drawn
  in a shape. One talk control: the Nova button. The core is his door to
  Nova's status and settings, as a contact's face is in Messages.
  Type: 20 (serif: the stage sentence and the close), 17, 15, 13, the tab
  label 11; numerals in SF Rounded. Every control 44 or more.

  DEMO CONTENT ONLY. The repo is public; nothing here is his data. The
  conversation, sleep and protein numbers, the plan change and every time
  are invented.
-->

<script>
(function(){
  const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];

  /* ---------- the demo conversation (invented) ---------- */

  const sleepBars=(cls)=>'<div class="bars7 floor'+(cls?' '+cls:'')+'" role="img" aria-label="Sleep each night this week; Tuesday 6.2 hours, under the 7 hour line; the rest over it">'+

    '<div class="days7"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div>';
  const P={
    sleepPanel:'<button class="card panel" aria-label="Sleep this week. Tap to enlarge"><span class="pl">Sleep this week'+ico('expand')+'</span>'+sleepBars()+'<p class="pfoot">Tuesday 6.2 h, the one night under your 7 h line</p></button>',

      '<p class="pfoot">Wednesday 09:00 dentist · Thursday free after 18:00</p></button>'
  };
  const T={
    earlier:'<button class="earlier">Earlier this week · 24</button>',
    today:'<span class="day">Today</span>',
    q1:'<div class="you">How did I sleep this week?</div><span class="meta">08:02</span>',
    a1:'<div class="nova">Six of seven nights were over seven hours.\n• Monday 7 h 40\n• Tuesday 6 h 10, the short one\n• The other five over 7 h</div>',

    ev:'<button class="erow">'+ico('chart')+'<span class="t">Sleep, this week</span><span class="s">Evidence '+ico('right')+'</span></button>',

    plan:'<div class="card" style="padding:14px 16px"><span class="meta">Your plan came back · 13:05</span><p class="say" style="font-size:20px">A lighter week before the trip.</p><div class="btnrow" style="margin-top:10px"><button class="qbtn">Walk me through it</button><button class="qbtn">'+ico('dumbbell')+'To the Coach</button><button class="qbtn">Keep in vault</button></div></div>',

  const meterComposer=(t)=>{let lv='';const H=[4,9,14,20,12,7,16,22,18,10,6,12,19,24,15,8,5,11,17,13,9,6,4,8,12,16,10,7];H.forEach((h)=>{lv+='<i style="height:'+h+'px"></i>';});

  /* ---------- the "where it went" lists ---------- */

    ['Talk: tap to start, tap to send now, a pause sends','A B: the Nova button · C: the orb'],

    ['The live clock','Retired: the status bar has it'],
    ['Type and send','The composer bar (C: in the pull)'],
    ['Attach photos or video, remove before sending','＋ in the composer; the photo rides inside the field'],
    ['Where it will go (→ Shopping)','A chip inside the field, beside the words'],
    ['The transcript: time, where, day separators','A: the page · B: the drawer · C: the pull'],
    ['New chat, and its Undo','⋯ menu; the Undo as a receipt'],
    ['Remember (file a line via the Inbox)','Hold a line: Remember · Play again · Copy'],

    ['The evidence card','A row: Evidence ›'],

    ['Stage focus and the centre card','A tap on a card opens it full width'],
    ['The close: Yes · No · Later · Stop, n of N','The deck card, gold (✓ · Later · Talk · ✕); End the brief joins the ⋯ menu while a close runs'],
    ['Tap to hear','A glass strip with ▶ and ✕'],
    ['Waveform, iOS state bars','Bars in the state line; the live meter while he talks'],
    ['Let Nova learn you · morning · evening','⋯ menu (C: the pull), and a suggestion when idle'],
    ['Brief me','⋯ menu (C: the pull)'],
    ['Ambient','⋯ menu (C: the pull)'],
    ['Mic · Answers · Engine status','⋯ menu, three rows'],

  /* ---------- round 2: the pieces D and E share ---------- */

  const core=(size,st)=>'<span class="corebox" role="img" aria-label="'+CORE_WORDS[st]+'" style="width:'+size+'px;height:'+size+'px"><canvas class="core" data-size="'+size+'" data-core="'+st+'"></canvas></span>';

    '<button class="mi">'+ico('tray')+'<span>Remember</span><span class="v">via Inbox</span></button>'+

       ['The page, bubbles, composer, the close card, receipts','A, under the stage'],

   {n:'Listen',nova:'listen',cls:'a-thread ez',bottom:1,tally:'<b>E · 2 Listening.</b> The core grows to fill the stage (about 160 pt across) and brightens with each syllable; bars and words under it; the composer becomes his level, a timer and <b>Send now</b>; the Nova button rings · the stage never changes height, so nothing below it moves',
    html:estage('listen',sline(bars(),'Listening','a pause sends · 0:07'))+'<div class="thread rise" style="--i:2">'+T.today+T.q1+T.a1+T.a1meta+settledSleep+T.q2+T.a2+pulledMoved+'</div>'+meterComposer('0:07')},
   {n:'Think',nova:'talk',cls:'a-thread ez',bottom:1,tally:'<b>E · 3 Thinking.</b> The core spins, large: rings three times faster, two arcs chasing · the words under it name the source; the skeleton waits in the thread',
    html:estage('think',sline(dots,'Thinking','reading your sleep log'))+'<div class="thread rise" style="--i:2">'+T.earlier+T.today+T.q2+T.a2+pulledMoved+T.q1+skel+'</div>'+idleComposer},
   {n:'Speak',nova:'speak',cls:'a-thread ez',bottom:1,tally:'<b>E · 4 Speaking.</b> The core steps into the stage’s corner and pulses with her voice while the stage shows what she is showing (panel 2 of 3, tap to open) and her sentence in serif, lit as spoken · the stage keeps its height, so the thread does not move · when she finishes, the panel pushes down into the thread as a card (E · 1) and the core returns to the centre',
    html:estageSpeak+'<div class="thread rise" style="--i:2">'+T.earlier+T.today+T.q2+T.a2+pulledMoved+T.q1+'</div>'+idleComposer},
   {n:'Failed',nova:'talk',cls:'a-thread ez',bottom:1,tally:'<b>E · 5 A failed transcription.</b> The stage says it in words (<b>the last one didn’t arrive</b>); the kept recording and the red card sit at the foot of the thread, beside the composer: <b>Try again</b> sends the same 9 seconds, <b>Type it</b> opens the keyboard',
    html:estage('idle',sline(ico('mic'),'Your turn','the last one didn’t arrive'))+'<div class="thread rise" style="--i:2">'+T.today+T.q1+T.a1+T.a1meta+settledSleep+recKept+failKept+'</div>'+idleComposer},
   {n:'Offline',nova:'off',cls:'a-thread ez',bottom:1,tally:'<b>E · 6 Offline.</b> Said once, on the stage: the core grey and still, <b>Offline</b> and the last reply’s time, and Retry beside it · the thread stays, dimmed and labelled last known; the Nova button greys',
    html:estage('off',sline(ico('cloudoff'),'Offline','last reply 08:04'),'<button class="qbtn" style="margin-top:6px">'+ico('retry')+'Retry</button>')+'<div class="thread rise" style="--i:2"><span class="day">Last known · 08:04</span><div class="stale" style="display:flex;flex-direction:column;gap:14px">'+T.q1+T.a1+T.a1meta+settledSleep+'</div></div>'+offComposer},
   {n:'Hold',nova:'talk',cls:'a-thread ez',bottom:1,tally:'<b>E · 7 Hold a line.</b> As D · 7: <b>Remember</b> (via the Inbox), <b>Play again</b>, <b>Replay the stage</b>, <b>Copy</b> · a replay runs on the stage above, and the thread stays put',
    html:estage('idle',sline(ico('mic'),'Your turn','tap Nova or type'))+'<div class="thread">'+held(T.today+T.q2+T.a2+pulledMoved+T.q1)+'</div>'+idleComposer},
   {n:'Button',nova:'talk',cls:'a-thread ez',anchor:'.door',tally:'<b>E · 8 From the Nova button.</b> The same record as D · 8: what he said on Fuel, her reply, the stage she showed there as a settled card, the report, and the logged shake with Undo, under <b>Said on Fuel, with the Nova button</b> · the stage above is back at rest, his turn',
    html:estage('idle',sline(ico('mic'),'Your turn','tap Nova or type'))+'<div class="thread rise" style="--i:2">'+T.earlier+T.today+T.q2+T.a2+pulledMoved+fromBtn+'</div>'+idleComposer},
   {n:'Back',nova:'talk',cls:'a-thread ez hist',tally:'<b>E · 9 Reading back.</b> E’s cost is a third of the screen at every moment, so scrolling up into the history folds the stage to a 64 pt bar: the core, still alive at 44 pt, <b>Nova ›</b>, the state, and <b>Now</b>, which jumps back to the newest line, where the stage opens again · the thread gets <b>531 pt</b> while he reads back · the fold is a proposal (his call)',
    html:estageFold+'<div class="thread rise" style="--i:2">'+T.siri+T.attach+T.routed+T.brief+T.acted+T.plan+T.replaced+'</div>'+idleComposer}
  ]};


  /* ---------- the living core: the filament engine of src/NovaCore.jsx, ported ----------
     Same seed and structure (broken circuit arcs, wisps, embers, the breathing
     heart). It changes by form and never by hue: grows with his voice while
     listening, spins while thinking, pulses with her voice while speaking,
     grey and still offline. The level is simulated here; the app has the real
     one (audioLevel). Reduced motion: one still frame. */
  const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const seeded=(seed)=>{let x=seed;return()=>(x=(x*16807)%2147483647)/2147483647;};
  function buildCore(cv){
    const size=+cv.dataset.size,dpr=Math.min(window.devicePixelRatio||1,2);
    cv.width=size*dpr;cv.height=size*dpr;const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);
    const o=size>=120?{bands:32,segs:36,arc:1.15,weight:1,chaos:1,speed:.16,embers:540,wisps:84,heart:.12}
                     :{bands:12,segs:16,arc:1.2,weight:1.1,chaos:.85,speed:.14,embers:110,wisps:14,heart:.2};
    const r=seeded(7),cx=size/2,cy=size/2,R0=size*.46;
    const bands=[];for(let b=0;b<o.bands;b++){const f=.1+.9*(b/(o.bands-1)),segs=[],n=Math.round(o.segs*(.5+r()));
      for(let i=0;i<n;i++)segs.push({a0:r()*6.283,len:.02+r()*r()*o.arc,w:.5+r()*1.6*o.weight,jit:(r()-.5)*R0*.05*o.chaos,al:(.16+r()*.5)*(1.35-.55*f),fl:r()*6.28,fs:.5+r()*2});
      bands.push({f,segs,vel:(r()-.5)*o.speed,squash:1-r()*.14*o.chaos,tilt:(r()-.5)*.5*o.chaos});}
    const embers=[];for(let i=0;i<o.embers;i++)embers.push({f:Math.pow(r(),1.25),ang:r()*6.283,sz:.35+r()*1.3,al:.15+r()*.55,tw:r()*6.28,ts:.6+r()*2.4});
    const wisps=[];for(let i=0;i<o.wisps;i++){const a=r()*6.283;wisps.push({a,b:a+(r()-.5)*2.4,f1:.25+r()*.7,f2:.25+r()*.7,bulge:(r()-.5)*1.6,al:.05+r()*.12});}
    let clock=0,last=null,grow=null,lvl=0;
    const col=(f,a)=>'hsla('+(224-f*36)+','+(90-f*10)+'%,'+Math.min(38+(1-f)*44+lvl*12,88)+'%,'+a+')';
    return function(t){
      const st=cv.dataset.core;
      lvl=(st==='listen'||st==='speak')?Math.max(0,.2+.17*Math.sin(t*6.3)+.11*Math.sin(t*14.1+1.3)+.06*Math.sin(t*2.2)):0;
      const target=st==='listen'?.95:st==='speak'?.8:.74;
      grow=grow==null?target:grow+(target-grow)*.08;
      const R=R0*(grow+(st==='speak'?lvl*.12:st==='listen'?lvl*.05:0));
      const dt=last==null?0:Math.min(t-last,.1);last=t;
      clock+=dt*(1+lvl*2.6+(st==='think'?3.2:0)+(st==='listen'||st==='speak'?.4:0));
      ctx.clearRect(0,0,size,size);ctx.globalCompositeOperation='lighter';
      for(const w of wisps){const rot=clock*.03,x1=cx+Math.cos(w.a+rot)*R*w.f1,y1=cy+Math.sin(w.a+rot)*R*w.f1*.94,x2=cx+Math.cos(w.b+rot)*R*w.f2,y2=cy+Math.sin(w.b+rot)*R*w.f2*.94;
        let mx=(x1+x2)/2+(y2-y1)*w.bulge*.3,my=(y1+y2)/2-(x2-x1)*w.bulge*.3;mx=mx*.62+cx*.38;my=my*.62+cy*.38;
        ctx.strokeStyle=col(.5,w.al*(1+lvl*1.2));ctx.lineWidth=.7;ctx.beginPath();ctx.moveTo(x1,y1);ctx.quadraticCurveTo(mx,my,x2,y2);ctx.stroke();}
      for(const b of bands){const rad=R*b.f*(1+lvl*.16*Math.sin(clock*3.1+b.f*9));ctx.save();ctx.translate(cx,cy);ctx.rotate(b.tilt);ctx.scale(1,b.squash);const rot=clock*b.vel;
        for(const s of b.segs){const fl=.55+.45*Math.sin(clock*s.fs+s.fl);ctx.strokeStyle=col(b.f,s.al*fl*(1+lvl*1.4));ctx.lineWidth=s.w*(1+lvl*.5);ctx.beginPath();ctx.arc(0,0,Math.max(.5,rad+s.jit),s.a0+rot,s.a0+rot+s.len);ctx.stroke();}
        ctx.restore();}
      for(const e of embers){const tw=.4+.6*Math.abs(Math.sin(clock*e.ts+e.tw)),x=cx+Math.cos(e.ang+clock*.05)*R*e.f,y=cy+Math.sin(e.ang+clock*.05)*R*e.f*.94;
        ctx.fillStyle=col(e.f,e.al*tw*(1+lvl*1.4));ctx.beginPath();ctx.arc(x,y,e.sz*(1+lvl*1.1)*(size<120?.8:1),0,6.29);ctx.fill();}
      if(st==='think'){ /* the spin, readable in a still: two arcs chasing round the rim */
        for(let k=0;k<2;k++){const a0=t*2.6+k*Math.PI;for(let j=0;j<16;j++){ctx.strokeStyle='hsla(190,95%,'+(60+j*2)+'%,'+(.05+j*.06)+')';ctx.lineWidth=size<120?2:3.2;ctx.lineCap='round';ctx.beginPath();ctx.arc(cx,cy,R*1.04,a0+j*.07,a0+j*.07+.08);ctx.stroke();}}}
      const pulse=1+.07*Math.sin(t*1.8)+lvl*1.15,hr=R*o.heart*pulse;
      const g=ctx.createRadialGradient(cx,cy,0,cx,cy,hr*3.2);g.addColorStop(0,'rgba(240,252,255,.95)');g.addColorStop(.18,'rgba(158,240,255,.8)');g.addColorStop(.45,'rgba(64,170,238,.35)');g.addColorStop(1,'rgba(20,60,140,0)');
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,hr*3.2,0,6.29);ctx.fill();
      ctx.globalCompositeOperation='source-over';
    };
  }
  function drawCores(t){$$('main.view:not([hidden]) canvas.core').forEach((cv)=>{if(!cv._d)cv._d=buildCore(cv);if(cv.dataset.core==='off'&&cv._still)return;cv._d(t);if(cv.dataset.core==='off')cv._still=1;});}
  if(!RM){const loop=()=>{drawCores(performance.now()/1000);requestAnimationFrame(loop);};requestAnimationFrame(loop);}

  /* ---------- the review's own ruler (window.__m): what the tallies quote ---------- */
  window.__m=function(){
    const main=$('main.view:not([hidden])'),topY=$('.switch').offsetHeight,botY=innerHeight-$('.dock').offsetHeight;
    const comp=$('.composer',main),compTop=comp?comp.getBoundingClientRect().top:botY;
    const ok=(el)=>{const r=el.getBoundingClientRect();return r.width>0&&r.height>0&&!el.closest('.note');};
    const sizes=new Set();$$('*',main).forEach((el)=>{if(!ok(el))return;if(![...el.childNodes].some((n)=>n.nodeType===3&&n.textContent.trim()))return;const cs=getComputedStyle(el);if(cs.fontFamily.includes('rounded')&&/^\d/.test(el.textContent.trim()))return;sizes.add(parseFloat(cs.fontSize));});
    let taps=0,under=0,minT=999;$$('button,[role=button]',main).forEach((b)=>{if(!ok(b))return;const r=b.getBoundingClientRect();if(r.bottom<topY||r.top>botY)return;taps++;const m=Math.min(r.width,r.height);if(m<44)under++;minT=Math.min(minT,m);});
    const OBJ='.dhdr .who,.dhdr>.state,.estage,.dstage,.toprow h1,.toprow .iconbtn,.bhead h1,.bhead .iconbtn,main>.state,.thread>*:not(.meta):not(.day):not(.behind):not(.scrim),.thread>.behind>*:not(.meta):not(.day),.brail,.heard,.line,.stage,.drawer .dhead';
    let objs=0;$$(OBJ,main).forEach((el)=>{if(!ok(el))return;const r=el.getBoundingClientRect(),vis=Math.min(r.bottom,compTop)-Math.max(r.top,topY);if(vis>=Math.min(r.height,compTop-topY)/2)objs++;});
    const hdr=$('.dhdr,.estage',main),hb=hdr?hdr.getBoundingClientRect().bottom:topY,ds=$('.dstage',main),db=ds?ds.getBoundingClientRect().bottom:hb;
    const w=document.documentElement.scrollWidth;
    return JSON.stringify({s:location.hash,sw:w,vw:innerWidth,sizes:[...sizes].sort((a,b)=>b-a),taps,under44:under,minTap:Math.round(minT),objs,threadPx:Math.round(compTop-Math.max(hb,db)),hdrPx:Math.round(hb-topY),switchPx:topY});
  };

  /* ---------- the switcher (as mockup 58) ---------- */
  const phone=$('#phone');
  Object.keys(S).forEach((v)=>S[v].forEach((sc,i)=>{const m=document.createElement('main');m.id=v+(i+1);m.className='view'+(sc.cls?' '+sc.cls:'');m.hidden=true;m.dataset.tally=sc.tally;m.dataset.nova=sc.nova;if(sc.bottom)m.dataset.bottom='1';if(sc.anchor)m.dataset.anchor=sc.anchor;m.innerHTML=sc.html;phone.appendChild(m);}));
  const sw=$('.switch'),scr=$('#screens'),tally=$('#tally'),nb=$('#novabtn'),dr=$('#dockrow');
  const setH=()=>document.documentElement.style.setProperty('--switch-h',(sw.offsetHeight-(parseFloat(getComputedStyle(sw).paddingTop)||0)+8)+'px');
  function renderTally(){const full=tally.dataset.full||'';
    if(tally.classList.contains('open')){tally.innerHTML=full+' <span class="tm">less</span>';return;}
    tally.innerHTML=full;if(tally.scrollWidth<=tally.clientWidth+1)return;
    const tmp=document.createElement('div');tmp.innerHTML=full;const words=tmp.textContent.split(' ');
    while(words.length>1){words.pop();tally.innerHTML=words.join(' ').replace(/[\s,.;:·]+$/,'')+'… <span class="tm">more</span>';if(tally.scrollWidth<=tally.clientWidth+1)break;}}
  tally.addEventListener('click',()=>{tally.classList.toggle('open');renderTally();setH();});
  let v='a',s=1;
  function apply(){
    const main=document.getElementById(v+s);
    $$('main.view').forEach((m)=>{m.hidden=m!==main;});
    $$('[data-var]').forEach((b)=>b.setAttribute('aria-pressed',String(b.dataset.var===v)));
    scr.innerHTML=S[v].map((x,i)=>'<button data-s="'+(i+1)+'" aria-pressed="'+(i+1===s)+'">'+x.n+'</button>').join('');
    tally.dataset.full=main.dataset.tally;tally.classList.remove('open');
    const st=main.dataset.nova;
    nb.className='novabtn'+(st==='talk'?' talk':st==='listen'?' talk listen':st==='speak'?' talk speak':st==='off'?' off':'');
    nb.style.display=st==='none'?'none':'';dr.classList.toggle('solo',st==='none');
    nb.setAttribute('aria-label',st==='listen'?'Send now':st==='speak'?'Stop Nova and talk':st==='off'?'Nova is offline':'Talk to Nova');
    history.replaceState(null,'','#'+v+'/'+s);
    try{localStorage.setItem('nova-r2-63',v+'/'+s);}catch(e){}
    renderTally();setH();
    $$('.rise',main).forEach((el)=>{el.style.animation='none';void el.offsetWidth;el.style.animation='';});
    if(main.dataset.bottom)window.scrollTo(0,document.documentElement.scrollHeight);
    if(main.dataset.anchor){const el=$(main.dataset.anchor,main),hd=$('.dhdr,.estage',main);window.scrollTo(0,el.getBoundingClientRect().top+scrollY-hd.getBoundingClientRect().bottom-12);}
    drawCores(RM?1.7:performance.now()/1000);
  }
  scr.addEventListener('click',(e)=>{const b=e.target.closest('[data-s]');if(!b)return;s=+b.dataset.s;window.scrollTo(0,0);apply();});
  $$('[data-var]').forEach((b)=>b.addEventListener('click',()=>{v=b.dataset.var;s=1;window.scrollTo(0,0);apply();}));
  function fromHash(){const h=(location.hash||'').replace('#','').toLowerCase();const p=h.split('/');if(!S[p[0]])return false;v=p[0];const n=+p[1];s=n>=1&&n<=S[v].length?n:1;return true;}
  window.addEventListener('hashchange',()=>{if(fromHash()){window.scrollTo(0,0);apply();}});
  window.addEventListener('resize',()=>{renderTally();setH();});
  if(!fromHash()){try{const p=(localStorage.getItem('nova-r2-63')||'').split('/');if(S[p[0]]){v=p[0];const n=+p[1];s=n>=1&&n<=S[v].length?n:1;}}catch(e){}}
  apply();
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{renderTally();setH();});
})();
</script>
