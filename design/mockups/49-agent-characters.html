<!doctype html>
<html lang="en" data-nv-calm="0">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Agent World · character sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Rajdhani:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<!--
  49 · THE AGENT WORLD — CHARACTER SHEET (second pass, 23 Sep)
  design/AGENT-WORLD-PLAN.md §3g. Nine beings, each in its working and
  waiting pose. This is the sheet, not the map — the geography is 48.

  WHAT THE SECOND PASS CHANGED, and why (his two notes):

  1 · "I cannot see them — the screen is so zoomed in the controls do not
      work." FRAMING IS NOW SOLVED, NOT GUESSED. The deck's real extremes
      are sampled off the geometry and the camera distance is SOLVED for:
      the closest distance at which every one of those points still lands
      inside the FREE rectangle (the viewport minus whatever the caption
      and header cover) in BOTH axes, with an 8% margin. Re-run on every
      resize and orientation change. "Fit all" says so out loud. (The
      brief asked for a bounding sphere; a box-corner sphere around a flat
      ring over-reads by 40% — measured r=6.42 on a deck 4.2 across, which
      is exactly why the first attempt framed the nine into the middle
      third of the screen. Same intent, done exactly. See measureExtents.) Under 700px the ring is not a distant toy: the sheet opens
      PAGED — one being large, arrows, swipe — and "Show all" returns.
      The claim is measured in the page, not asserted: __fitReport()
      projects every head to screen space and says whether it landed
      inside. It logs on load; read the console.

  2 · "They look like random 3D objects stuck to each other." Every body
      is now ONE LATHED SURFACE — a hand-drawn profile (base → waist →
      chest → shoulders → neck → head) revolved and smooth-shaded, with
      the cross-section squared off per being where the job wants a slab
      (CFO's ledger, Guardian's shield) rather than a second mesh bolted
      on. The panel lines and seams are DRAWN INTO the texture as darker
      bands, so there is no separate trim mesh anywhere. Materials are
      MeshPhysicalMaterial with clearcoat and a per-being procedural
      canvas grain (brushed, hex micro-plate, knit, paper, ceramic glaze,
      satin, ruled, scan, weave) on both colour and roughness. Faces are
      shaped emissive lenses with a catchlight, and they act: asymmetric
      blinks, saccades, look-at tracking, and a per-being expression.

  RENDERER — Body3D.jsx:774-830 and Shelf3D.jsx's conventions: ACES tone
  mapping at 1.05, sRGB output, PCF soft shadows, a PMREM environment
  generated from a scene (not downloaded), a shadow-only ground so the
  page's own gradient shows through, and colours READ as --nv-* tokens off
  the mount element so Calm recolours the world for free.

  TWO DEVIATIONS, both forced and both stated:
    1. three.js is pinned at 0.160.0. cdnjs carries no UMD build past
       r160 (0.170.0 ships three.module.js only, verified by 404), and
       cdnjs is the only script host allowed where this will be published.
    2. RoomEnvironment and OrbitControls live in examples/jsm and so are
       absent from the UMD bundle. The room is rebuilt here (makeRoomEnv,
       now nine panels with a bright key strip and a cool fill so the
       clearcoat and the visors have something real to reflect) and the
       controls are hand-rolled drag / wheel / pinch / double-tap.

  MOTION BUDGET — idle life is the point of this pass, so the loop runs,
  but capped at 30fps, only while the tab is visible, and only while
  something is actually moving. prefers-reduced-motion (or the toggle):
  no blinking, no breathing, no bar lifting, static poses, and the loop
  goes back to render-on-demand. window.__frames counts real draws.
-->
<style>
  :root {
    --nv-font-ui:'Rajdhani','Instrument Sans',system-ui,sans-serif;
    --nv-font-serif:'Instrument Serif',serif;
    --nv-font-mono:'IBM Plex Mono',monospace;
    --nv-micro-track:.14em; --nv-micro-track-wide:.2em;
    --nv-ease:cubic-bezier(.32,.72,0,1);
    --nv-dur-fast:.16s; --nv-dur-base:.28s; --nv-dur-slow:.44s;

    --nv-void:#06070d; --nv-bg1:#0a0f1e; --nv-bg2:#111a32;
    --nv-ink:#e8ecf6; --nv-ink60:rgba(232,236,246,.62); --nv-ink40:rgba(232,236,246,.38);
    --nv-glass:rgba(16,20,36,.62); --nv-glass2:rgba(26,32,54,.8);
    --nv-edge:rgba(130,175,255,.24); --nv-spec:rgba(190,225,255,.45);
    --nv-cy:#59e6ff; --nv-vi:#8f7bff; --nv-mg:#ff7ad9; --nv-gold:#e0b26a;
    --nv-good:#5fe8a8; --nv-warn:#e08383;
    --nv-m-chest:#ff8a7a; --nv-m-back:#4fd1c5; --nv-m-shoulders:#ffc46b;
    --nv-m-quads:#7ab8ff; --nv-m-calves:#8fd3ff; --nv-m-abs:#ffd66b;
    --nv-m-triceps:#b48cff; --nv-m-biceps:#5fe8a8; --nv-m-glutes:#c98bff;
    --nv-acc:#59e6ff; --nv-acc-bg:rgba(89,230,255,.07); --nv-acc-border:rgba(89,230,255,.42);
    --nv-radius:10px;
    --nv-aur1:rgba(89,230,255,.12); --nv-aur2:rgba(143,123,255,.14);
    --nv-glow-cta:0 0 30px -10px rgba(89,230,255,.95);
    --nv-blur:18px;
    /* 3D-side tokens: the renderer reads these off the mount, so Calm
       is one block below instead of a second lighting rig. */
    --nv-key:#fff2e2; --nv-fill:#bcd4ff; --nv-rim:#9fdcff;
    --nv-shell:#c9d3e4;
    --nv-emissive:1;       /* multiplier on every emissive core */
    --nv-env:.72;
    --nv-stage:#0d1426;
  }
  /* CALM — the observatory block's values (src/index.css ~215-260). Last, so it wins. */
  :root[data-nv-calm="1"] {
    --nv-void:#070b13; --nv-bg1:#0c1424; --nv-bg2:#152742;
    --nv-ink:#ece5da; --nv-ink60:rgba(236,229,218,.62); --nv-ink40:rgba(236,229,218,.38);
    --nv-glass:rgba(21,28,44,.55); --nv-glass2:rgba(28,38,58,.75);
    --nv-edge:rgba(236,229,218,.12); --nv-spec:rgba(236,229,218,.3);
    --nv-cy:#6be5f5; --nv-vi:#a68ce2; --nv-mg:#e08f6f; --nv-gold:#d8b573; --nv-good:#5aa87c;
    --nv-acc:#d8b573; --nv-acc-bg:rgba(216,181,115,.1); --nv-acc-border:rgba(216,181,115,.38);
    --nv-radius:14px;
    --nv-aur1:rgba(138,106,209,.13); --nv-aur2:rgba(107,229,245,.07);
    --nv-glow-cta:0 4px 18px -6px rgba(216,181,115,.6);
    --nv-blur:26px;
    --nv-key:#ffeeda; --nv-fill:#cbb9d8; --nv-rim:#d8b573;
    --nv-shell:#d4ccc0;
    --nv-emissive:.55;
    --nv-env:.86;
    --nv-stage:#121a2c;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--nv-void); color: var(--nv-ink);
    font-family: var(--nv-font-ui); overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  #sky {
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(120% 80% at 50% 8%, var(--nv-aur1), transparent 62%),
      radial-gradient(90% 70% at 12% 96%, var(--nv-aur2), transparent 60%),
      linear-gradient(176deg, var(--nv-bg2) 0%, var(--nv-bg1) 46%, var(--nv-void) 100%);
    transition: background var(--nv-dur-slow) var(--nv-ease);
  }
  /* touch-action:none is load-bearing — without it Safari takes the
     one-finger drag for a page pan and the turntable never turns. */
  #stage { position: fixed; inset: 0; z-index: 1; touch-action: none; cursor: grab; }
  #stage.dragging { cursor: grabbing; }
  #stage canvas { display: block; }

  /* ---- chrome ---- */
  header {
    position: fixed; z-index: 3; top: 0; left: 0;
    display: flex; flex-direction: column; gap: 3px;
    padding: 16px 18px 0; pointer-events: none;
    max-width: 62vw;
  }
  h1 {
    margin: 0; font-family: var(--nv-font-serif); font-weight: 400;
    font-size: clamp(18px, 3.4vw, 25px); letter-spacing: .01em; line-height: 1.1;
  }
  h1 em { font-style: italic; color: var(--nv-ink60); }
  .kicker {
    font: 500 9px var(--nv-font-mono); letter-spacing: var(--nv-micro-track-wide);
    text-transform: uppercase; color: var(--nv-ink40);
  }
  #tools {
    position: fixed; z-index: 5; top: 14px; right: 14px;
    display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end;
    max-width: calc(100vw - 28px);
  }
  .tool {
    appearance: none; border: 1px solid var(--nv-edge);
    background: var(--nv-glass); backdrop-filter: blur(var(--nv-blur)); -webkit-backdrop-filter: blur(var(--nv-blur));
    color: var(--nv-ink60); font: 500 9px var(--nv-font-mono);
    letter-spacing: var(--nv-micro-track); text-transform: uppercase;
    padding: 7px 10px; border-radius: var(--nv-radius); cursor: pointer;
    transition: color var(--nv-dur-fast) var(--nv-ease), border-color var(--nv-dur-fast) var(--nv-ease), background var(--nv-dur-fast) var(--nv-ease);
  }
  .tool[aria-pressed="true"] { color: var(--nv-acc); border-color: var(--nv-acc-border); background: var(--nv-acc-bg); }

  /* ---- caption ----------------------------------------------------
     Over 900px it is a SIDE panel and the camera aims into the space
     that is left; under that it is a bottom sheet capped at 34% of the
     height. Either way it never covers the being it is describing —
     __fitReport() checks that and says so. */
  #caption {
    position: fixed; z-index: 4;
    border: 1px solid var(--nv-edge); border-radius: calc(var(--nv-radius) + 4px);
    background: var(--nv-glass); backdrop-filter: blur(var(--nv-blur)) saturate(140%);
    -webkit-backdrop-filter: blur(var(--nv-blur)) saturate(140%);
    box-shadow: 0 18px 50px -28px rgba(0,0,0,.9), inset 0 1px 0 var(--nv-spec);
    padding: 14px 16px 13px;
    left: 50%; bottom: 16px; transform: translateX(-50%);
    width: min(640px, calc(100vw - 28px));
    max-height: 34vh; overflow: auto;
    display: grid; grid-template-columns: 1fr; gap: 3px 18px; align-items: start;
  }
  @media (min-width: 901px) {
    #caption {
      left: auto; right: 16px; bottom: auto; top: 50%; transform: translateY(-50%);
      width: 330px; max-height: min(74vh, 560px);
      grid-template-columns: 1fr; align-items: start;
    }
  }
  #cap-dept {
    font: 500 9px var(--nv-font-mono);
    letter-spacing: var(--nv-micro-track-wide); text-transform: uppercase;
    color: var(--cap-hue, var(--nv-acc));
    display: flex; align-items: center; gap: 7px;
  }
  #cap-dept::before {
    content: ''; width: 6px; height: 6px; border-radius: 50%;
    background: var(--cap-hue, var(--nv-acc));
    box-shadow: 0 0 10px -1px var(--cap-hue, var(--nv-acc));
  }
  #cap-name {
    font-family: var(--nv-font-serif); font-weight: 400;
    font-size: clamp(23px, 5.4vw, 31px); line-height: 1.05; letter-spacing: .01em;
    margin: 1px 0 3px;
  }
  #cap-line { font-size: 14px; line-height: 1.38; color: var(--nv-ink60); max-width: 42ch; }
  #cap-tell { margin-top: 7px; font: 500 9px var(--nv-font-mono); letter-spacing: var(--nv-micro-track); text-transform: uppercase; color: var(--nv-ink40); }
  /* the two poses read as one pair under the line, at every width — the
     side-by-side variant put them on top of the sentence between 700 and
     900px, which is exactly the band a laptop window lands in */
  #poses { grid-column: 1; display: flex; flex-direction: row; gap: 16px; margin-top: 10px; align-self: start; }
  .pose {
    appearance: none; background: none; border: 0; padding: 4px 0;
    color: var(--nv-ink40); font: 600 12px var(--nv-font-ui);
    letter-spacing: .06em; text-transform: uppercase; text-align: left; cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: color var(--nv-dur-fast) var(--nv-ease), border-color var(--nv-dur-fast) var(--nv-ease);
    white-space: nowrap;
  }
  .pose:hover { color: var(--nv-ink60); }
  .pose[aria-pressed="true"] { color: var(--nv-ink); border-bottom-color: var(--cap-hue, var(--nv-acc)); }

  /* ---- the pager (phone default) ---- */
  .arrow {
    position: fixed; z-index: 5; top: 44%; transform: translateY(-50%);
    width: 44px; height: 60px; display: none; place-items: center;
    appearance: none; border: 1px solid var(--nv-edge); border-radius: var(--nv-radius);
    background: var(--nv-glass); backdrop-filter: blur(var(--nv-blur)); -webkit-backdrop-filter: blur(var(--nv-blur));
    color: var(--nv-ink60); font-size: 22px; line-height: 1; cursor: pointer;
    font-family: var(--nv-font-ui);
  }
  body.paged .arrow { display: grid; }
  #prev { left: 10px; }
  #next { right: 10px; }
  #dots {
    position: fixed; z-index: 4; left: 0; right: 0; display: none;
    justify-content: center; gap: 6px; pointer-events: none;
    bottom: calc(16px + var(--cap-h, 150px) + 10px);
  }
  body.paged #dots { display: flex; }
  #dots i {
    width: 5px; height: 5px; border-radius: 50%; background: var(--nv-ink40);
    opacity: .45; transition: opacity var(--nv-dur-fast) var(--nv-ease), background var(--nv-dur-fast) var(--nv-ease);
  }
  #dots i.on { opacity: 1; background: var(--cap-hue, var(--nv-acc)); }

  #hint {
    position: fixed; z-index: 3; left: 50%; transform: translateX(-50%);
    bottom: calc(16px + var(--cap-h, 120px) + 10px);
    font: 500 9px var(--nv-font-mono); letter-spacing: var(--nv-micro-track);
    text-transform: uppercase; color: var(--nv-ink40); pointer-events: none;
    transition: opacity var(--nv-dur-base) var(--nv-ease);
  }
  body.paged #hint { display: none; }
  @media (min-width: 901px) { #hint { left: calc(50% - 180px); } }
  #frames {
    position: fixed; z-index: 3; left: 14px; bottom: 5px;
    font: 400 9px var(--nv-font-mono); letter-spacing: .1em; color: var(--nv-ink40);
    opacity: .5; pointer-events: none;
  }
  #fallback {
    position: fixed; inset: 0; z-index: 6; display: none; place-items: center;
    padding: 24px; text-align: center; color: var(--nv-ink60); font-size: 15px;
  }
  @media (max-width: 700px) {
    header { padding: 12px 14px 0; max-width: 58vw; }
    h1 { font-size: 19px; }
    #caption { left: 12px; right: 12px; bottom: 12px; width: auto; transform: none; padding: 12px 14px; }
    #cap-line { font-size: 13px; }
    #tools { top: auto; bottom: calc(12px + var(--cap-h, 150px) + 34px); right: 12px; }
  }
</style>
</head>
<body>
<div id="sky"></div>
<div id="stage"></div>

<header>
  <h1>The Agent World <em>· nine beings</em></h1>
  <span class="kicker">character sheet · §3g</span>
</header>

<div id="tools">
  <button class="tool" id="t-fit">Fit all</button>
  <button class="tool" id="t-mode" aria-pressed="false">Show all</button>
  <button class="tool" id="t-motion" aria-pressed="false">Reduce motion</button>
  <button class="tool" id="t-calm" aria-pressed="false">Calm</button>
</div>

<button class="arrow" id="prev" aria-label="Previous being">&lsaquo;</button>
<button class="arrow" id="next" aria-label="Next being">&rsaquo;</button>
<div id="dots"></div>

<div id="hint">Drag to turn · tap a being · double-tap to reset</div>

<div id="caption">
  <div id="cap-dept"></div>
  <div id="cap-name"></div>
  <div id="cap-line"></div>
  <div id="cap-tell"></div>
  <div id="poses">
    <button class="pose" id="p-work" aria-pressed="false">Working</button>
    <button class="pose" id="p-wait" aria-pressed="true">Waiting</button>
  </div>
</div>

<div id="frames">frames 0</div>
<div id="fallback">The stage needs WebGL. The honest fallback on the real surface is the same view model drawn as a list of markers.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
<script>
(function () {
  'use strict';
  if (!window.THREE) { document.getElementById('fallback').style.display = 'grid'; return; }
  var T = window.THREE;
  var root = document.documentElement;
  var mount = document.getElementById('stage');
  var PHONE_W = 700;

  // ---------------------------------------------------------------
  // TOKENS — read off the mount, never literals.
  // ---------------------------------------------------------------
  var TK = {};
  function readTokens() {
    var cs = getComputedStyle(mount);
    function c(n) { return new T.Color(cs.getPropertyValue(n).trim() || '#888'); }
    function f(n, d) { var v = parseFloat(cs.getPropertyValue(n)); return isNaN(v) ? d : v; }
    TK.key = c('--nv-key'); TK.fill = c('--nv-fill'); TK.rim = c('--nv-rim');
    TK.shell = c('--nv-shell'); TK.gold = c('--nv-gold'); TK.ink = c('--nv-ink');
    TK.stage = c('--nv-stage'); TK.edge = c('--nv-cy'); TK.void = c('--nv-void');
    TK.em = f('--nv-emissive', 1); TK.env = f('--nv-env', .72);
    TK.hue = {
      cy: c('--nv-cy'), vi: c('--nv-vi'), mg: c('--nv-mg'), good: c('--nv-good'),
      gold: c('--nv-gold'),
      chest: c('--nv-m-chest'), back: c('--nv-m-back'), shoulders: c('--nv-m-shoulders'),
      quads: c('--nv-m-quads'), calves: c('--nv-m-calves'), abs: c('--nv-m-abs'),
      triceps: c('--nv-m-triceps'), biceps: c('--nv-m-biceps'), glutes: c('--nv-m-glutes')
    };
  }
  readTokens();

  // ---------------------------------------------------------------
  // THE NINE (§3g, in table order).
  // `hue` is the department's, and is dominant. `accent` is this pass's
  // addition: a SECOND hue per being, so no two read alike even with the
  // silhouette taken away. Both are --nv-* tokens; neither is invented.
  // `skin` picks the procedural grain; `face` is the expression set.
  // ---------------------------------------------------------------
  var AGENTS = [
    { id: 'commander', name: 'Commander', dept: 'Logistics', hue: 'cy', accent: 'gold', skin: 'brushed',
      line: 'Sets the order of the day and points the fleet at the next thing.',
      work: 'Working — the arm comes up, the compass swings to the newest thing.',
      wait: 'Waiting — a marker over its head, eyes blinking slow.',
      face: { shape: 'alert', gap: .088, size: 1.0, look: 'ahead' } },
    { id: 'coach', name: 'Coach', dept: 'Train', hue: 'chest', accent: 'abs', skin: 'knit',
      line: 'Reads the program, calls the session, and holds you to the lift.',
      work: 'Working — the bar comes off the shoulders, bending under the load.',
      wait: 'Waiting — the bar is set down on the floor.',
      face: { shape: 'narrow', gap: .092, size: 1.05, look: 'set' } },
    { id: 'cfo', name: 'CFO', dept: 'Money', hue: 'good', accent: 'gold', skin: 'ruled',
      line: 'Counts what came in and what went out, and says so plainly.',
      work: 'Working — a chip lands on the stack, one per real receipt.',
      wait: 'Waiting — arms folded over the ledger, the stack held.',
      face: { shape: 'thin', gap: .082, size: 1.0, look: 'ledger' } },
    { id: 'guardian', name: 'Guardian', dept: 'Platform', hue: 'vi', accent: 'gold', skin: 'hex',
      line: 'Keeps the backups landing and the quiet loops from staying quiet.',
      work: 'Working — the lantern comes up bright as a backup lands.',
      wait: 'Waiting — the lantern is down at amber; something went quiet.',
      face: { shape: 'wide', gap: .086, size: 1.12, look: 'calm' } },
    { id: 'researcher', name: 'Researcher', dept: 'Knowledge', hue: 'quads', accent: 'cy', skin: 'brushed',
      line: 'Reads the thing you asked about and comes back with the page.',
      work: 'Working — leaning in, the page turning and curling beside the lens.',
      wait: 'Waiting at the budget — the page hangs half-turned.',
      face: { shape: 'iris', single: true, gap: 0, size: 1.0, look: 'read' } },
    { id: 'watcher', name: 'Watcher', dept: 'Knowledge', hue: 'calves', accent: 'vi', skin: 'scan',
      line: 'Watches the whole video so you only see the two minutes that matter.',
      work: 'Working — a scanline sweeps the visor like a screen.',
      wait: 'Waiting — the screen is held on one still frame.',
      face: { shape: 'slit', single: true, gap: 0, size: 1.0, look: 'scan' } },
    { id: 'librarian', name: 'Librarian', dept: 'Knowledge', hue: 'back', accent: 'shoulders', skin: 'spines',
      line: 'Files every note where you will find it again, and says where.',
      work: 'Working — the drawer slides, a book eases out, one spine lights.',
      wait: 'Waiting — the drawer stands open with nothing filed.',
      face: { shape: 'spectacle', gap: .084, size: .95, look: 'tidy' } },
    { id: 'mealprep', name: 'Meal Prep', dept: 'Fuel', hue: 'shoulders', accent: 'chest', skin: 'glaze',
      line: 'Works out what to eat tonight from what is actually in the kitchen.',
      work: 'Working — the lid lifts a crack and the steam comes off the top.',
      wait: 'Waiting — the base is banked low, nothing on.',
      face: { shape: 'crescent', gap: .088, size: 1.06, look: 'warm' } },
    { id: 'leader', name: 'Leader', dept: 'Mind', hue: 'mg', accent: 'vi', skin: 'satin',
      line: 'Listens back over the struggle, then asks the question you avoided.',
      work: 'Working — light crosses the mirror as it takes your answer in.',
      wait: 'Waiting — perfectly still, holding the question.',
      face: { shape: 'soft', gap: .09, size: 1.05, look: 'listen' } }
  ];

  // ---------------------------------------------------------------
  // RENDERER
  // ---------------------------------------------------------------
  var renderer;
  try {
    renderer = new T.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
  } catch (e) { document.getElementById('fallback').style.display = 'grid'; return; }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputColorSpace = T.SRGBColorSpace;
  renderer.toneMapping = T.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = T.PCFSoftShadowMap;
  mount.appendChild(renderer.domElement);

  var scene = new T.Scene();
  var camera = new T.PerspectiveCamera(30, 1, 0.1, 90);

  // IMAGE-BASED LIGHT, generated not downloaded. RoomEnvironment is an
  // examples/jsm module and so absent from the UMD bundle; this is the same
  // idea, and this pass makes it a real room: a bright key strip overhead,
  // a large cool fill down one wall, a warm bounce behind, and four dim
  // upright panels that give the clearcoat and the visors long vertical
  // highlights to catch. Without those the shells read as flat plastic.
  function makeRoomEnv() {
    var s = new T.Scene();
    var box = new T.BoxGeometry(1, 1, 1);
    function panel(col, inten, sx, sy, sz, x, y, z, back) {

  // ---------------------------------------------------------------

  // ---------------------------------------------------------------
  // ONE SCULPTED BODY.

  function latheGeo(pts, seg, squ, depth) {

  // THE VISOR IS A MOULDED MASK, not a slice of a sphere. A constant-phi
  // band cuts the face with two dead-straight edges and a hard vertical

  // letterbox sticker on a ball. This wraps the head with a band that

    N = N || 56; M = M || 12;

      for (j = 0; j < M; j++) {

    g.setAttribute('uv', new T.Float32BufferAttribute(uv, 2));

  // ---- the shaped, animated eye ----------------------------------

      s.quadraticCurveTo(w * 0.8, h * 0.92, w, h * 0.1);
      s.quadraticCurveTo(w * 0.4, -h * 0.85, -w * 0.2, -h * 0.8);

    if (e.touches.length < 2) pinch.active = false;
  }
  mount.addEventListener('touchend', endTouch);
  mount.addEventListener('touchcancel', endTouch);
  function touchDist(e) {
    var a = e.touches[0], b = e.touches[1];
    return Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
  }

  var ray = new T.Raycaster(), ndc = new T.Vector2();
  function pick(cx, cy) {
    var r = renderer.domElement.getBoundingClientRect();
    ndc.x = ((cx - r.left) / r.width) * 2 - 1;
    ndc.y = -((cy - r.top) / r.height) * 2 + 1;
    ray.setFromCamera(ndc, camera);
    var hits = ray.intersectObjects(FIG.map(function (f) { return f.hit; }), false);
    if (hits.length) setFocus(hits[0].object.userData.index);
    else setFocus(-1);
  }
  function spinTo(i) {
    var want = -FIG[i].ang;
    var k = Math.round((view.spinT - want) / (Math.PI * 2));
    view.spinT = want + k * Math.PI * 2;
  }
  function setFocus(i) {
    focus = i;
    if (i >= 0) { spinTo(i); view.elevT = clamp(view.elev, 0.05, 0.4); setCaption(i); }
    else setCaption(capIndex);
    document.getElementById('hint').style.opacity = i >= 0 ? '0' : '1';
    reframe(false);
  }
  function resetView() {
    view.elevT = mode === 'paged' ? 0.14 : 0.52;
    if (mode === 'ring') setFocus(-1); else { spinTo(page); reframe(false); }
    invalidate();
  }

  // ---- the paged view (the phone default) ------------------------
  var dotsEl = document.getElementById('dots');
  AGENTS.forEach(function () { dotsEl.appendChild(document.createElement('i')); });
  function setMode(m, snap) {
    mode = m;
    document.body.classList.toggle('paged', m === 'paged');
    bMode.textContent = m === 'paged' ? 'Show all' : 'One at a time';
    bMode.setAttribute('aria-pressed', String(m === 'paged'));
    FIG.forEach(function (f, i) {
      var on = (m !== 'paged') || i === page;
      f.slot.visible = on;
      f.plate.visible = on && m !== 'paged';
      f.mark.visible = on;
    });
    if (m === 'paged') { focus = -1; spinTo(page); view.elevT = 0.14; setCaption(page); }
    else { view.elevT = 0.52; }
    document.getElementById('hint').style.opacity = m === 'paged' ? '0' : '1';
    reframe(snap);
  }
  function goPage(i) {
    page = (i + AGENTS.length) % AGENTS.length;
    FIG.forEach(function (f, k) { f.slot.visible = (k === page); f.mark.visible = (k === page); });
    spinTo(page); setCaption(page); reframe(false);
    for (var k2 = 0; k2 < dotsEl.children.length; k2++) dotsEl.children[k2].className = (k2 === page ? 'on' : '');
  }
  document.getElementById('prev').addEventListener('click', function () { goPage(page - 1); });
  document.getElementById('next').addEventListener('click', function () { goPage(page + 1); });
  window.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight') { mode === 'paged' ? goPage(page + 1) : setFocus((focus + 1) % AGENTS.length); }
    if (e.key === 'ArrowLeft') { mode === 'paged' ? goPage(page - 1) : setFocus((focus - 1 + AGENTS.length) % AGENTS.length); }
    if (e.key === 'Escape') { setFocus(-1); }
  });

  // ---------------------------------------------------------------
  // CAPTION
  // ---------------------------------------------------------------
  var capIndex = 0;
  var elDept = document.getElementById('cap-dept'), elName = document.getElementById('cap-name'),
      elLine = document.getElementById('cap-line'), elTell = document.getElementById('cap-tell'),
      elCap = document.getElementById('caption'),
      bWork = document.getElementById('p-work'), bWait = document.getElementById('p-wait');

  function setCaption(i) {
    capIndex = i;
    var f = FIG[i], a = f.a;
    elCap.style.setProperty('--cap-hue', '#' + hueOf(a).getHexString());
    document.body.style.setProperty('--cap-hue', '#' + hueOf(a).getHexString());
    elDept.textContent = a.dept;
    elName.textContent = a.name;
    elLine.textContent = a.line;
    elTell.textContent = f.state === 'work' ? a.work : a.wait;
    bWork.setAttribute('aria-pressed', f.state === 'work');
    bWait.setAttribute('aria-pressed', f.state === 'wait');
    measureCap();
  }
  function measureCap() {
    root.style.setProperty('--cap-h', elCap.offsetHeight + 'px');
  }
  function setPose(st) {
    var f = FIG[capIndex];
    f.state = st;
    f.b.marker.visible = (st === 'wait');
    setCaption(capIndex);
    invalidate();
  }
  bWork.addEventListener('click', function () { setPose('work'); });
  bWait.addEventListener('click', function () { setPose('wait'); });

  // ---------------------------------------------------------------
  // TOGGLES
  // ---------------------------------------------------------------
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var bMotion = document.getElementById('t-motion'), bCalm = document.getElementById('t-calm'),
      bFit = document.getElementById('t-fit'), bMode = document.getElementById('t-mode');
  bMotion.setAttribute('aria-pressed', String(reduce));
  bMotion.addEventListener('click', function () {
    reduce = !reduce; bMotion.setAttribute('aria-pressed', String(reduce));
    FIG.forEach(function (f) {
      f.b.face.blink = 0; f.b.face.sacc.set(0, 0); f.b.face.saccT.set(0, 0);
      f.b.body.scale.set(1, 1, 1);
      f.b.head.position.y = f.b.headY;
      f.b.group.rotation.z = 0; f.b.group.position.x = 0;
    });
    invalidate();
  });
  bCalm.addEventListener('click', function () {
    var on = root.getAttribute('data-nv-calm') !== '1';
    root.setAttribute('data-nv-calm', on ? '1' : '0');
    bCalm.setAttribute('aria-pressed', String(on));
    applyTokens();
  });
  bFit.addEventListener('click', function () {
    if (mode === 'paged') setMode('ring', false);
    else { setFocus(-1); view.spinT = Math.PI / 9; view.elevT = 0.52; reframe(false); }
  });
  bMode.addEventListener('click', function () {
    setMode(mode === 'paged' ? 'ring' : 'paged', false);
  });

  function applyTokens() {
    readTokens();
    scene.environmentIntensity = TK.env;
    key.color.copy(TK.key); fill.color.copy(TK.fill); rim.color.copy(TK.rim);
    deckMat.color.copy(TK.stage);
    rimRing.material.color.copy(lighter(TK.edge, 0.3));
    innerRing.material.color.copy(lighter(TK.edge, 0.3));
    EMISSIVES.forEach(function (m) {
      if (m.userData.baseEm != null) m.emissiveIntensity = m.userData.baseEm * TK.em;
    });
    FIG.forEach(function (f) {
      f.mark.material.color.copy(lighter(hueOf(f.a), 0.3));
      f.b.rimL.intensity = 1.5 * (TK.em > 0.8 ? 1 : 0.7);
    });
    setCaption(capIndex);
    invalidate();
  }

  // ---------------------------------------------------------------
  // DIMMING — the others recede when one is focused
  // ---------------------------------------------------------------
  function collectMats(f) {
    var list = [];
    f.b.group.traverse(function (o) {
      if (!o.material || list.indexOf(o.material) >= 0) return;
      var m = o.material;
      if (m.color) m.userData.baseColor = m.color.clone();
      if (m.envMapIntensity != null) m.userData.baseEnv = m.envMapIntensity;
      list.push(m);
    });
    f.mats = list;
  }
  function applyDim(f, k) {
    for (var i = 0; i < f.mats.length; i++) {
      var m = f.mats[i];
      if (m.userData.baseColor) m.color.copy(m.userData.baseColor).lerp(TK.void, k * 0.72);
      if (m.userData.baseEnv != null) m.envMapIntensity = m.userData.baseEnv * (1 - k * 0.8);
      if (m.userData.baseEm != null) m.emissiveIntensity = m.userData.baseEm * TK.em * (1 - k * 0.88);
      if (m.userData.baseOp != null) m.opacity = m.userData.baseOp * (1 - k * 0.9);
    }
    f.b.rimL.intensity = 1.5 * (1 - k * 0.9);
    f.mark.material.opacity = 0.4 * (1 - k * 0.85);
    f.plate.material.opacity = 0.62 * (1 - k) * (focus >= 0 ? 0 : 1);
    f.b.contact.material.opacity = 0.8 * (1 - k * 0.8);
  }

  // ---------------------------------------------------------------
  // THE LOOP — capped at 30fps, only while the tab is visible, and only
  // while something is actually moving. window.__frames counts real draws.
  // ---------------------------------------------------------------
  var running = false, MIN_DT = 1 / 30, lastDraw = 0;
  function approach(cur, tgt, dt, k) { return cur + (tgt - cur) * (1 - Math.exp(-dt * k)); }

  function updateFace(f, now, dt, working) {
    var face = f.b.face, live = false;
    if (!reduce) {
      if (face.blink > 0) {
        face.blink -= dt; live = true;
        if (face.blink <= 0) { face.blink = 0; face.nextBlink = now + (working ? 5.5 : 2.2) + Math.random() * 5; }
      } else if (now > face.nextBlink) { face.blink = 0.3; live = true; }
      if (now > face.nextSacc) {
        face.saccT.set((Math.random() - 0.5) * 0.026, (Math.random() - 0.5) * 0.014);
        face.nextSacc = now + (working ? 0.7 : 1.5) + Math.random() * 2.4;
      }
      face.sacc.lerp(face.saccT, Math.min(1, dt * 9));
      live = true;
    } else { face.blink = 0; face.sacc.set(0, 0); }
    if (expression(face, f.a.face.look, now, working, reduce)) live = true;
    return live;
  }

  function tick() {
    var now = performance.now() / 1000;
    if (!dirty && now - lastDraw < MIN_DT - 0.002) { requestAnimationFrame(tick); return; }
    var dt = Math.min(0.08, now - lastT); lastT = now;
    var live = false;

    var ns = approach(view.spin, view.spinT, dt, 7);
    var nd = approach(view.dist, view.distT, dt, 6);
    var ne = approach(view.elev, view.elevT, dt, 7);
    var nty = approach(view.ty, view.tyT, dt, 6);
    var ntz = approach(view.tz, view.tzT, dt, 6);
    if (Math.abs(ns - view.spinT) > 1e-4 || Math.abs(nd - view.distT) > 1e-4 ||
        Math.abs(ne - view.elevT) > 1e-4 || Math.abs(nty - view.tyT) > 1e-4 ||
        Math.abs(ntz - view.tzT) > 1e-4) live = true;
    view.spin = ns; view.dist = nd; view.elev = ne; view.ty = nty; view.tz = ntz;
    stageGroup.rotation.y = view.spin;
    camera.position.set(0, view.ty + Math.sin(view.elev) * view.dist, view.tz + Math.cos(view.elev) * view.dist);
    camera.lookAt(0, view.ty, view.tz);

    FIG.forEach(function (f, i) {
      if (!f.slot.visible) return;
      var b = f.b, working = f.state === 'work';
      b.group.rotation.y = -(view.spin + f.ang) + f.yawOff;

      // BREATHING and a weight shift — 2% on the body, slow, and the head
      // rides it so the face stays on the neck.
      if (!reduce) {
        var br = Math.sin(now * 0.85 + f.phase);
        b.body.scale.set(1 + br * 0.012, 1 + br * 0.006, 1 + br * 0.012);
        b.head.position.y = b.headY * (1 + br * 0.006);
        b.group.rotation.z = f.lean + Math.sin(now * 0.21 + f.phase) * 0.013;
        b.group.position.x = Math.sin(now * 0.17 + f.phase * 1.3) * 0.012;
        live = true;
      } else {
        b.group.rotation.z = f.lean;
      }
      // look-at: the head carries the saccade, and pitches to meet the camera
      b.head.rotation.y = f.baseHeadY + b.face.sacc.x * 3 + f.yawOff * 0.4;
      b.head.rotation.x = f.baseHeadX - view.elev * 0.2;

      var tt = FREEZE == null ? now : FREEZE;
      if (b.tell && b.tell(tt, working, reduce)) live = true;
      if (updateFace(f, now, dt, working)) live = true;

      if (b.marker.visible) {
        if (reduce) { b.marker.position.y = b.markerY + 0.02; }
        else {
          b.marker.position.y = b.markerY + Math.sin(now * 1.9 + i) * 0.05;
          b.marker.rotation.y = Math.sin(now * 0.9 + i) * 0.15;
          live = true;
        }
      }

      var want = (focus >= 0 && focus !== i) ? 1 : 0;
      var nk = approach(f.dim, want, dt, 6);
      if (Math.abs(nk - want) > 0.004) live = true;
      if (Math.abs(nk - f.dim) > 0.0005 || dirty) { f.dim = nk; applyDim(f, nk); }
      else f.dim = nk;
    });

    renderer.render(scene, camera);
    frames++; lastDraw = now;
    window.__frames = frames;
    fpsEl.textContent = 'frames ' + frames;

    dirty = false;
    if (live && !document.hidden) requestAnimationFrame(tick);
    else running = false;
  }
  var fpsEl = document.getElementById('frames');
  document.addEventListener('visibilitychange', function () { if (!document.hidden) invalidate(); });

  // ---------------------------------------------------------------
  // THE MEASUREMENT. The framing claim is checked in the page, not
  // asserted: every head is projected to screen space and reported.
  // ---------------------------------------------------------------
  function fitReport(log) {
    camera.updateMatrixWorld(true);
    var W = mount.clientWidth, H = mount.clientHeight;
    var capR = elCap.getBoundingClientRect();
    var rows = [], allIn = true;
    FIG.forEach(function (f) {
      if (!f.slot.visible) return;
      f.b.head.getWorldPosition(_v3);
      _v3.project(camera);
      var x = (_v3.x * 0.5 + 0.5) * W, y = (-_v3.y * 0.5 + 0.5) * H;
      var inside = x >= 0 && x <= W && y >= 0 && y <= H;
      var underCaption = x >= capR.left && x <= capR.right && y >= capR.top && y <= capR.bottom;
      if (!inside) allIn = false;
      rows.push({ name: f.a.name, x: Math.round(x), y: Math.round(y), inside: inside, underCaption: underCaption });
    });
    var out = { viewport: W + 'x' + H, mode: mode, allHeadsInside: allIn, heads: rows };
    if (log !== false) {
      console.log('[fit] ' + W + 'x' + H + ' mode=' + mode + ' allHeadsInside=' + allIn +
        ' dist=' + (Math.round(view.dist * 100) / 100) +
        ' distT=' + (Math.round(view.distT * 100) / 100) + ' fov=' + camera.fov +
        ' eff=' + Math.round(freeRect().effW) + 'x' + Math.round(freeRect().effH));
      rows.forEach(function (r) {
        console.log('[fit] ' + r.name + ' @ ' + r.x + ',' + r.y + ' inside=' + r.inside + (r.underCaption ? ' UNDER-CAPTION' : ''));
      });
    }
    return out;
  }
  window.__fitReport = fitReport;

  // ---------------------------------------------------------------
  // GO
  // ---------------------------------------------------------------
  var FREEZE = null;
  var t0 = performance.now() / 1000;
  FIG.forEach(function (f) {
    f.b.marker.visible = true;
    f.b.face.nextBlink += t0; f.b.face.nextSacc += t0;
    applyDim(f, 0);
  });
  setCaption(0);
  resize();
  setMode(mount.clientWidth < PHONE_W ? 'paged' : 'ring', true);
  if (mode === 'paged') goPage(0);
  measureCap();
  reframe(true);
  invalidate();

  // fonts land after the first paint; the name plates are canvas, so repaint
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () {
      FIG.forEach(function (f) {
        var np = namePlate(f.a.name, TK.ink);
        f.plate.material.map.dispose();
        f.plate.material.map = np.material.map;
        f.plate.material.needsUpdate = true;
      });
      measureCap(); reframe(false); invalidate();
      setTimeout(function () { fitReport(true); }, 260);
    });
  } else {
    setTimeout(function () { fitReport(true); }, 400);
  }

  (function () {
    var h = (location.hash || '').replace('#', '');
    if (!h) return;
    var q = {};
    h.split('&').forEach(function (kv) { var a = kv.split('='); q[a[0]] = a[1]; });
    if (q.calm === '1') { root.setAttribute('data-nv-calm', '1'); bCalm.setAttribute('aria-pressed', 'true'); applyTokens(); }
    if (q.motion === 'reduce') { reduce = true; bMotion.setAttribute('aria-pressed', 'true'); }
    if (q.mode) setMode(q.mode === 'paged' ? 'paged' : 'ring', true);
    if (q.pose === 'work') FIG.forEach(function (f) { f.state = 'work'; f.b.marker.visible = false; });
    if (q.page != null) goPage(parseInt(q.page, 10) || 0);
    if (q.focus != null) setFocus(parseInt(q.focus, 10) || 0);
    if (q.elev != null) { view.elevT = parseFloat(q.elev); }
    if (q.t != null) { FREEZE = parseFloat(q.t); }
    if (q.spin != null) { view.spinT += parseFloat(q.spin); }
    reframe(true);
    FIG.forEach(function (f, i) { f.dim = (focus >= 0 && focus !== i) ? 1 : 0; applyDim(f, f.dim); });
    setCaption(capIndex);
  })();

  window.__agentSheet = {
    focus: function (i) { setFocus(i); },
    page: function (i) { if (mode !== 'paged') setMode('paged', true); goPage(i); },
    mode: function (m) { setMode(m, true); },
    poseAll: function (st) { FIG.forEach(function (f) { f.state = st; f.b.marker.visible = (st === 'wait'); }); setCaption(capIndex); invalidate(); },
    pose: function (i, st) { FIG[i].state = st; FIG[i].b.marker.visible = (st === 'wait'); if (i === capIndex) setCaption(i); invalidate(); },
    spin: function (v) { view.spinT = v; invalidate(); },
    elev: function (v) { view.elevT = v; invalidate(); },
    zoom: function (k) { view.distT = wantDist() * k; invalidate(); },
    snap: function () { view.spin = view.spinT; view.dist = view.distT; view.elev = view.elevT; view.ty = view.tyT; view.tz = view.tzT; invalidate(); },
    fit: function () { reframe(true); },
    report: fitReport,
    frames: function () { return frames; },
    count: AGENTS.length
  };
})();
</script>
</body>
</html>
