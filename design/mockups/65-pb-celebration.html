<!--
  65 · THE RECORD (29 Sep 2026)
  His words, 29 Sep, on the Finish sheet of the new live session (mockup 61,
  screen 5; src/screens/SessionSummary.jsx FinishSheet + Gauge):
    "I prefer a more clear phrase to state that I've achieved a PB."
    "I want the record gauge animation and icon to change so it feels more
     celebratory and exciting and dynamic. Maybe something to do with a trophy
     but with more dynamic animations so it truly feels exciting. Possibly even
     something relating to that specific lift or muscle group as well. Provide
     a few ideas for me to decide from."
    "The hue is a nice touch." (the gauge wears the lift's muscle hue; kept)

  Four ideas, one per variation, #a to #d:
    a  The trophy rises   the house gauge completes, a trophy in the hue rises
                          through its open foot, light bursts through the ring
    b  The plate loads    the kit in profile: a stack pin drops for a machine or
                          cable lift, a plate slides onto the sleeve for a bar
    c  The muscle lights  the app's own figure (src/BodyMap.jsx) does one rep of
                          the lift and the muscle it trained lights, a ring out
    d  The medal, struck  a medal on a ribbon in the hue spins once to face him,
                          is struck with the number, a specular sweep crosses it

  Three screens each: 1 Sheet (Lat Pulldown, Back, teal, a cable lift), 2 Filed
  (the confirmed moment after the server files it), 3 Bench (Bench Press,
  Chest, coral, a barbell lift: the same idea in another lift and hue).

  THE TWO-STAGE WORDING, because the phrase must be true at each moment.
  On the sheet the client knows one thing: this set beat last time
  (valsSessionSummary.js recordCandidates, "a record is confirmed when it
  files"). So the sheet says "You beat last time", plainly and large. The
  all-time check is the server's, after filing; only then does Nova say
  "New personal best", on the house overlay (src/PersonalRecord.jsx). If the
  server does not confirm an all-time best, the overlay never plays and the
  sheet's sentence was still true.

  Motion: every moment plays once, under 2.5 s, and stops. Replay (in the
  switcher) plays it again; in the app a tap on the object would. Still shows
  what prefers-reduced-motion gets: the object at rest and the final number,
  faded in. Filed replays only the moment's peak (its timeline starts late),
  because he has already watched the build-up on the sheet.

  Material: mockup 61's nova-glass, copied (variables, switcher, sheet, tab
  bar, .rise). Type 34 · 20 · 15 · 13, numerals in SF Rounded (44 and 52 on
  the moment). Colour: every moment wears the lift's muscle hue from
  src/muscleHue.js MUSCLE_HEX; no gold, which on this page means waiting on
  him. The one filled control is still Finish.

  Sound (Sound in the switcher, off until tapped; the app's own setting is on
  by default): synthesised here as the app would, the house glass bell
  (src/sfx.js CHIMES) plus a knock and a struck bell. In the app these claim
  iOS's ambient session like the technique reel: they mix with his music,
  never pause it, and the ring switch silences them.

  DEMO CONTENT ONLY. Pull day, Push day, every weight and count is invented.
-->

   screenshot get); animation is added only when motion is allowed and the moment is playing (.go).

   late by --shift, so its build-up has already happened and only the peak plays. */

.stage{position:relative;height:236px;margin-top:10px}

/* ================= THE RECORD: motion, only where motion is wanted ================= */
@media (prefers-reduced-motion:no-preference){
  body:not(.still) .moment.go [data-a]{animation-delay:calc(var(--d,0ms) - var(--shift,0ms)) !important}

  body:not(.still) .moment.go .tro .was{animation:arc 650ms var(--eo) both}
  body:not(.still) .moment.go .tro .past{animation:arc 320ms var(--eo) both}
  body:not(.still) .moment.go .tro .cup{animation:troRise 560ms var(--eo) both}
  body:not(.still) .moment.go .tro .rays{animation:burst 620ms var(--eo) both}
  body:not(.still) .moment.go .tro .glow{animation:glow 750ms ease-out both}
  body:not(.still) .moment.go .tro .num b{animation:bump 260ms var(--eo) both}
  /* b · stack */
  body:not(.still) .moment.go .stack .pin{animation:pin 750ms both}
  body:not(.still) .moment.go .stack .lit{animation:litIn 260ms ease-out both}
  body:not(.still) .moment.go .stack .lab.on{animation:litIn 260ms ease-out both}
  body:not(.still) .moment.go .stack .sel{animation:rep 600ms var(--eio) both}
  /* b · bar */
  body:not(.still) .moment.go .bar .np{animation:slideOn 520ms both}
  body:not(.still) .moment.go .bar .olds{animation:knock 160ms ease-out both}
  body:not(.still) .moment.go .bar .collar{animation:collar 280ms var(--eo) both}
  /* b shared: the old number drops, the new one is stamped */
  body:not(.still) .moment.go .ro-num b.old{animation:oldOut 180ms ease-in both}
  body:not(.still) .moment.go .ro-num b.new{animation:stamp 300ms var(--eo) both}
  body:not(.still) .moment.go .ro-up{animation:fadeUp 260ms var(--eo) both}
  /* c */
  body:not(.still) .moment.go .fig .limb{animation:limb 700ms var(--eio) both}
  body:not(.still) .moment.go .fig .lit{animation:litIn 300ms ease-out both}
  body:not(.still) .moment.go .fig .glowp{animation:glowP 650ms ease-out both}
  body:not(.still) .moment.go .fig .ringc{animation:ringOut 700ms var(--eo) both}
  /* d */
  body:not(.still) .moment.go .med .rib,body:not(.still) .moment.go .med .loop{animation:ribDrop 300ms var(--eo) both}
  body:not(.still) .moment.go .med .disc{animation:spin 1000ms var(--eo) both}
  body:not(.still) .moment.go .med .eng{animation:strike 220ms var(--eo) both}
  body:not(.still) .moment.go .med .hit{animation:bump 250ms var(--eo) both}
  body:not(.still) .moment.go .med .shine i{animation:sweep 600ms ease-in-out both}
  body:not(.still) .moment.go .med .halo{animation:glow 700ms ease-out both}
  /* Filed: the claim itself is stamped at the peak */
  body:not(.still) .moment.go .prl b.hl{animation:stampS 280ms var(--eo) both}
}

<script>
(function(){
  const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
  const reduced=()=>(typeof matchMedia==='function'&&matchMedia('(prefers-reduced-motion: reduce)').matches)||document.body.classList.contains('still');
  const kg=(n)=>String(Math.round(n*100)/100);

  // ---------------------------------------------------------------- demo lifts
  // Two lifts in two hues and two kinds of kit, so each idea is seen in more than one lift.
  const LIFTS={
    lat:{name:'Lat Pulldown',group:'Back',hue:'var(--m-back)',from:60,to:62.5,reps:8,kit:'stack',step:2.5,
      view:'back',primary:['lats'],secondary:[['rhomboids','var(--m-back)'],['rear-delts','var(--m-shoulders)']],
      armL:'rotate(120deg)',armR:'rotate(-120deg)',ring:[50,80],
      day:'Pull day',trio:['16','5,760','48'],ticked:'16 of 20',open:4},
    bench:{name:'Bench Press',group:'Chest',hue:'var(--m-chest)',from:80,to:82.5,reps:5,kit:'barbell',
      view:'front',primary:['chest'],secondary:[['front-delts','var(--m-shoulders)']],
      armL:'rotate(38deg) translateY(-4px)',armR:'rotate(-38deg) translateY(-4px)',ring:[50,56],
      day:'Push day',trio:['15','6,180','52'],ticked:'15 of 15',open:0},

  // ---------------------------------------------------------------- timelines (ms)
  // total: when the last thing settles. shift: where Filed starts the same timeline. peak: the beat
  // the sound, the haptic and Filed's stamped sentence all land on (one frame, one cause).
  const TL={
    a:{picks:[0,450,900,1050,1250,1800],total:1800,shift:750,peak:1150,count:[0,1000],snd:[['triad',1150]]},
    bs:{picks:[0,250,600,800,1250,1600],total:1600,shift:450,peak:750,snd:[['knock',750],['one',770]]},
    bb:{picks:[0,250,450,560,800,1000],total:1000,shift:250,peak:520,snd:[['knock',520],['one',540],['knock2',860]]},
    c:{picks:[0,350,650,850,1150,1650],total:1650,shift:600,peak:700,count:[650,1450],snd:[['two',700]]},
    d:{picks:[0,400,800,1120,1500,1850],total:1850,shift:850,peak:1100,snd:[['strike',1100]]},
  };
  const tlKey=(v,L)=>v==='b'?(L.kit==='stack'?'bs':'bb'):v;

  // ---------------------------------------------------------------- a · the trophy
  function trophy(L,uid){
    const R=38,MARK=.72,at=(f,r)=>{const t=(135+270*f)*Math.PI/180;return [(50+r*Math.cos(t)).toFixed(2),(50+r*Math.sin(t)).toFixed(2)];};
    const [x1,y1]=at(MARK,R-4),[x2,y2]=at(MARK,R+7),[lx,ly]=at(MARK,R+14);

    let rays='';for(let i=0;i<12;i++){if(i===2||i===3)continue;const a=(i*30+15)*Math.PI/180,r0=i%2?37:36,r1=i%2?43:47;rays+='<line x1="'+(r0*Math.cos(a)).toFixed(2)+'" y1="'+(r0*Math.sin(a)).toFixed(2)+'" x2="'+(r1*Math.cos(a)).toFixed(2)+'" y2="'+(r1*Math.sin(a)).toFixed(2)+'"/>';}

      '<rect x="11" y="4.5" width="42" height="4" rx="2" style="fill:color-mix(in srgb,var(--h) 40%,#fff)"/>'+
      '<path d="M17 11C17 25 20.5 33 26 38.5 22.5 32.5 20.5 25 20.5 11Z" fill="#fff" opacity=".42"/>'+
      '<path d="M24.5 21.5v5M27.5 19.5v9M36.5 19.5v9M39.5 21.5v5M27.5 24h9" fill="none" stroke-width="2.2" stroke-linecap="round" style="stroke:color-mix(in srgb,var(--h) 30%,#05070d)"/>'+

    return '<div class="stage tro" data-stage>'+
      '<div class="ring"><div class="glow" data-a style="--d:1050ms"></div>'+

  // ---------------------------------------------------------------- b · the kit
  function readout(L,{stampAt,oldAt,h}){
    const num='<div class="ro-num"><b class="old" data-a style="--d:'+oldAt+'ms">'+kg(L.from)+'</b><b class="new" data-a style="--d:'+stampAt+'ms">'+kg(L.to)+'</b></div>';

  }
  function stack(L){
    // a close window on the stack, labelled at the lift's own step; the pin moves from last time's plate to today's
    const N=8,first=L.to-4*L.step;let plates='',sel='',rest='';
    for(let i=0;i<N;i++){const y=6+i*27,w=first+i*L.step,isSel=i<=4;

      if(isSel)sel+=p;else rest+=p;}
    const pin='<g class="pin" data-a style="--d:0ms"><rect x="100" y="'+(6+4*27+9.5)+'" width="40" height="4" rx="2"/><circle cx="142" cy="'+(6+4*27+11.5)+'" r="7"/></g>';
    return '<div class="stage kit" data-stage><div class="split"><div class="stack"><svg viewBox="0 0 150 220" aria-hidden="true">'+
      '<rect class="rod" x="12" y="0" width="3" height="220" rx="1.5"/><rect class="rod" x="135" y="0" width="3" height="220" rx="1.5"/>'+
      '<g class="sel" data-a style="--d:1000ms">'+sel+pin+'</g>'+rest+'</svg></div>'+
      readout(L,{stampAt:750,oldAt:650})+'</div></div>';
  }
  function barbell(L){
    // the sleeve in profile: last time's plates in ink, today's in the hue; per side, so 2.5 in total is 1.25 a side
    const side=kg((L.to-L.from)/2);
    return '<div class="stage kit" data-stage><div class="bar"><svg viewBox="0 0 320 150" aria-hidden="true">'+
      '<rect class="shaft" x="0" y="70" width="84" height="10" rx="2"/>'+
      '<rect class="metal2" x="82" y="57" width="14" height="36" rx="3"/>'+
      '<rect class="metal" x="96" y="67" width="214" height="16" rx="3"/>'+
      '<g class="olds" data-a style="--d:520ms"><rect class="pl" x="98" y="0" width="25" height="150" rx="5"/><rect class="pl" x="125" y="18" width="19" height="114" rx="4"/>'+
        '<text class="lab" transform="translate(115 75) rotate(-90)" text-anchor="middle">20</text><text class="lab" transform="translate(139 75) rotate(-90)" text-anchor="middle">10</text></g>'+
      '<g class="np" data-a style="--d:0ms"><rect class="newp" x="146" y="43" width="10" height="64" rx="3"/><text class="newlab" x="151" y="34" text-anchor="middle">'+side+'</text></g>'+
      '<g class="collar" data-a style="--d:600ms"><rect class="metal2" x="158" y="59" width="17" height="32" rx="3"/><rect class="metal2" x="164" y="44" width="5" height="17" rx="2"/></g>'+
      '</svg>'+readout(L,{stampAt:520,oldAt:440,h:true})+'</div></div>';
  }

  // ---------------------------------------------------------------- c · the figure (src/BodyMap.jsx's own shapes)
  const mirror=(a)=>a.map((s)=>Object.assign({},s,{mx:true}));
  const FRONT={chest:[{d:'M30 46 Q40 43 48 47 L48 66 Q38 69 31 62 Z'},{d:'M70 46 Q60 43 52 47 L52 66 Q62 69 69 62 Z'}],
    'front-delts':mirror([{d:'M33 42 Q26 44 24 54 Q30 57 34 49 Z',limb:'arm'}])};
  const BACK={lats:mirror([{d:'M29 62 Q40 60 42 70 L42 96 Q33 94 28 80 Z'}]),rhomboids:[{d:'M41 58 L59 58 L57 76 L43 76 Z'}],
    'rear-delts':mirror([{d:'M33 42 Q26 44 24 54 Q30 57 34 49 Z',limb:'arm'}])};
  const SIL=[
    {part:'torso',d:'M50 7 a11.5 11.5 0 1 1 -0.01 0 Z'},{part:'torso',d:'M45 30 h10 v9 h-10 Z'},
    {part:'torso',d:'M50 38 q14 1 19 10 l3 20 q1 22 -3 42 q-19 5 -38 0 q-4 -20 -3 -42 l3 -20 q5 -9 19 -10 Z'},
    {part:'armL',d:'M28 50 q-6 4 -7 13 l-3 22 q-1 8 1 15 l1 20 q0 6 3 9 l6 -1 q1 -5 -1 -10 l-2 -19 q-1 -7 1 -14 l4 -21 q1 -8 -3 -14 Z'},
    {part:'armR',d:'M72 50 q6 4 7 13 l3 22 q1 8 -1 15 l-1 20 q0 6 -3 9 l-6 -1 q-1 -5 1 -10 l2 -19 q1 -7 -1 -14 l-4 -21 q-1 -8 3 -14 Z'},
    {part:'legL',d:'M41 111 q7 2 8 12 l-1 32 q0 8 -2 16 l-2 30 q-1 8 0 14 l-8 1 q-2 -7 -1 -15 l2 -30 q1 -9 0 -17 l-3 -30 q-1 -9 7 -13 Z'},
    {part:'legR',d:'M59 111 q-7 2 -8 12 l1 32 q0 8 2 16 l2 30 q1 8 0 14 l8 1 q2 -7 1 -15 l-2 -30 q-1 -9 0 -17 l3 -30 q1 -9 -7 -13 Z'}];
  const JOINTS={armL:'29px 50px',armR:'71px 50px',legL:'44px 112px',legR:'56px 112px',torso:'50px 108px'};
  // Every mirrored shape is drawn on BOTH sides here. (BodyMap.jsx, read not run: a mirrored shape
  // with no limb, such as the lats, looks to be emitted only on the left. Flagged in the report.)
  function shapes(regions,id,group){const out=[];for(const s of regions[id]||[]){

    requestAnimationFrame(()=>{tally.classList.remove('open');upd();});clearTimeout(apply.t);apply.t=setTimeout(upd,500);
  }
  scr.addEventListener('click',(e)=>{const b=e.target.closest('[data-s]');if(!b)return;s=+b.dataset.s;window.scrollTo(0,0);apply();});
  $$('[data-var]').forEach((b)=>b.addEventListener('click',()=>{v=b.dataset.var;s=1;window.scrollTo(0,0);apply();}));
  $('#replay').addEventListener('click',()=>play(document.getElementById(v+s)));
  $('#still').addEventListener('click',(e)=>{const on=!document.body.classList.contains('still');document.body.classList.toggle('still',on);e.currentTarget.setAttribute('aria-pressed',String(on));play(document.getElementById(v+s));});
  $('#snd').addEventListener('click',(e)=>{soundOn=!soundOn;e.currentTarget.setAttribute('aria-pressed',String(soundOn));if(soundOn)play(document.getElementById(v+s));});
  // in the app a tap on the object plays it again; here too
  document.addEventListener('click',(e)=>{if(e.target.closest('[data-stage]'))play(document.getElementById(v+s));});
  function fromHash(){const p=(location.hash||'').replace('#','').toLowerCase().split('/');if(!VARS[p[0]])return false;v=p[0];const n=+p[1];s=n>=1&&n<=3?n:1;return true;}
  window.addEventListener('hashchange',()=>{if(fromHash()){window.scrollTo(0,0);apply();}});
  window.addEventListener('resize',()=>{renderTally();setH();});
  if(!fromHash()){try{const p=(localStorage.getItem('nova-record-65')||'').split('/');if(VARS[p[0]]){v=p[0];const n=+p[1];s=n>=1&&n<=3?n:1;}}catch(e){}}
  apply();
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{setH();renderTally();});

  // for the reviewer: horizontal overflow and where the moment sits
  window.__fold=()=>{const m=document.getElementById(v+s),r=(el)=>el&&el.getClientRects().length?el.getBoundingClientRect():null;
    const st=r($('[data-stage]',m)),fn=r($('[data-fin]',m)),pr=r($('.prl',m));
    const over=$$('*',m).filter((el)=>{const b=el.getBoundingClientRect();return b.width&&(b.right>innerWidth+0.5||b.left<-0.5)&&!el.closest('svg');}).map((el)=>el.className&&el.className.baseVal!==undefined?el.className.baseVal:(el.className||el.tagName)).slice(0,6);
    return {screen:v+s,scrollWidth:document.documentElement.scrollWidth,stage:st&&[Math.round(st.top),Math.round(st.bottom)],words:pr&&[Math.round(pr.top),Math.round(pr.bottom)],finish:fn&&[Math.round(fn.top),Math.round(fn.bottom)],overflow:over};};
})();
</script>
