<!--
  67 · WHO IS ANSWERING, ROUND 2 (29 Sep 2026)
  His answers to round 1 (mockup 64), in his words: B's summary with the
  Coach's full message still viewable, but "I like the appearance of option
  A more"; the roster as B's bench "but it has the colour separation for
  each agent like option A", and "be able to tap on each agent while
  they're working so that I can see what they are actually doing"; A's
  joint layout, because it "takes up less screen real estate but still
  accessible at a glance and I can tap it for more information"; C's open
  view, and C's calendar panel with "a numerical time", as the glass panel
  he wants Nova to raise "wherever needed": for the Coach question, "a
  dynamic panel pop-up showing Monday's workout and highlighting the
  specific parts that it is referring to while it speaks back to me out
  loud", and the same for the joint answer, "purposeful and clear and not
  simply more clutter… it feels more like Jarvis from Iron Man."
  Standing rule, restated today: every agent can consult every other and
  Nova directs them all as CEO; drawn here as real (Nova asks the Coach,
  the Coach asks the Researcher, Nova asks the Librarian), with authorship
  on every reply.

  ONE blend (no variation switcher), on mockup 63's D (the thread as the
  page, the living core heading it, the stage rising over the thread while
  Nova speaks and settling into it as a card). Seven screens (#1 to #7);
  3 and 5 play in beats, one per spoken sentence (#3/1 … #3/4, 4 = settled):
    1 Ask       the hand-over line, the bench above the composer, each face
                in its own hue, lit and turning while it works
    2 Working   a tap on the Coach's seat: what it was handed, how long,
                and what it asked the Researcher
    3 Panel     Nova's short summary + "From the Coach" (openable), and the
                stage showing Monday's workout, lighting the lift, the set
                and the number as she says each; then the settled card
    4 Open      C's open view: the Coach's own words on the stage
    5 Joint     A's compact joint reply, and ONE composed panel lighting the
                stalled row, the book's passage and the finding in turn
    6 Alone     Nova by herself, C's calendar panel with the time
    7 Rules     when a panel appears and when it does not, in the page's
                own words, with small examples

  WHAT IT MAY SHOW. Only what code could know: who was asked, by whom, when,
  how long, what code handed each agent, and which asks came back. The
  hand-over line is written by code from the ask list. Every number on a
  panel is read by code from his records; the model only chooses WHICH part
  to light, by an address code checks against the data it built. A light
  is on only while the sentence that names it is being spoken.

  Colour: each agent's hue means that agent and nothing else: Coach coral,
  the Researcher blue, the Librarian teal (the hues beings.js gave them).
  A lit part of a panel wears the hue of whoever found it; Nova's own
  finding is lit in white. Cyan is the talk action only (the Nova button);
  gold (waiting on him) does not appear on these screens. Nothing is said by
  colour alone: a lit part is also ringed and everything else steps back,
  the stage names it in words ("2 of 3 · the set"), and the sentence
  naming it is underlined in the line below.

  DEMO CONTENT ONLY. The repo is public; nothing here is his data. The
  questions, weights, reps, dates, the book "Stronger Slowly", the research
  finding and every time are invented.
-->

.qbtn{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 16px;border-radius:22px;font:600 15px var(--ui);color:var(--ink);background:color-mix(in srgb,var(--ink) 10%,transparent);box-shadow:0 0 0 .5px var(--card-ring);white-space:nowrap}
.thumbs{display:flex;gap:6px;align-self:flex-end}
.thumbs i{width:64px;height:64px;border-radius:14px;background:linear-gradient(135deg,#3b5b7d,#1f2d4d);box-shadow:0 0 0 .5px var(--card-ring)}

/* the composer: one bar, above the tab bar */
.composer{position:fixed;left:12px;right:12px;bottom:calc(var(--dock-h) + env(safe-area-inset-bottom,0px) + 2px);z-index:18;max-width:378px;margin:0 auto;display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:6px;align-items:end;padding:6px;border-radius:28px;background:var(--tab);backdrop-filter:blur(24px) saturate(1.5);-webkit-backdrop-filter:blur(24px) saturate(1.5);box-shadow:0 0 0 .5px var(--tab-ring),0 1px 0 var(--card-hi) inset,0 12px 30px -14px rgba(0,0,0,.5)}
.plus{width:44px;height:44px;border-radius:22px;display:grid;place-items:center;color:var(--ink);background:color-mix(in srgb,var(--ink) 10%,transparent)}
.field{min-height:44px;display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:6px 14px;border-radius:22px;background:var(--well);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ink) 12%,transparent);font:400 15px/1.3 var(--ui);color:var(--ink3);text-align:left}
.field.typed{color:var(--ink)}
.field .route{display:inline-flex;align-items:center;height:26px;padding:0 9px;border-radius:13px;font:600 13px var(--ui);color:var(--ink);background:color-mix(in srgb,var(--ink) 14%,transparent)}
.field .att{display:inline-flex;align-items:center;gap:6px;font:400 13px var(--ui);color:var(--ink3)}
.field .att i{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#3b5b7d,#1f2d4d)}
.send{width:44px;height:44px;border-radius:22px;display:grid;place-items:center;background:var(--talk);color:var(--talk-ink)}
.send .ic{stroke-width:2.6}
.composer.off .field{opacity:.6}
.meter{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 14px;border-radius:22px;background:var(--well);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ink) 12%,transparent)}
.meter .lv{flex:1;display:flex;align-items:center;gap:3px;height:24px;overflow:hidden}
.meter .lv i{flex:none;width:3px;border-radius:2px;background:var(--ink)}
.meter .tm{font:600 15px var(--round);font-variant-numeric:tabular-nums;color:var(--ink2)}
.stop{height:44px;padding:0 14px;border-radius:22px;font:600 15px var(--ui);color:var(--ink);background:color-mix(in srgb,var(--ink) 12%,transparent);white-space:nowrap}


/* the skeleton and the review notes (as mockup 62) */
.skel{display:block;border-radius:6px;background:linear-gradient(90deg,rgba(255,255,255,.06),rgba(255,255,255,.15),rgba(255,255,255,.06));background-size:200% 100%;animation:shimmer 1.4s linear infinite}
@keyframes shimmer{to{background-position:-200% 0}}
/* review notes, set apart from the page by a dashed edge */
.note{margin:18px 0 0;padding:12px 14px;border-radius:16px;border:1px dashed color-mix(in srgb,var(--ink) 26%,transparent);font:400 13px/1.5 var(--ui);color:var(--ink2)}
.note b{color:var(--ink);font-weight:600}
.note ul{margin:6px 0 0;padding-left:16px}
.note li + li{margin-top:3px}
.note table{width:100%;border-collapse:collapse;margin-top:6px}
.note td{padding:4px 6px 4px 0;vertical-align:top;border-top:1px solid var(--sep)}
.note td:first-child{color:var(--ink3);width:42%}

/* ================= 64 · who is answering ================= */

/* each agent's hue, copied from src/index.css (the hues src/agentWorld/beings.js gave them) */
body[data-m="nova-glass"]{--coach:#ff8a7a;--researcher:#7ab8ff;--librarian:#4fd1c5}
.h-coach{--h:var(--coach)}.h-researcher{--h:var(--researcher)}.h-librarian{--h:var(--librarian)}
.seg button{padding:7px 1px}

/* the faces: one species (the helmet, the screen, the ear pods), one feature and one artefact each */
.face{--h:var(--ink2);position:relative;display:inline-block;width:var(--s,28px);height:var(--s,28px);flex:none}
.face svg{width:100%;height:100%;display:block;overflow:visible}
.face .shell{fill:color-mix(in srgb,var(--h) 34%,#0a0f1f);stroke:color-mix(in srgb,var(--h) 72%,transparent);stroke-width:1.5}
.face .pod{fill:color-mix(in srgb,var(--h) 60%,#0a0f1f)}
.face .scr{fill:#060914}
.face .eye{fill:color-mix(in srgb,var(--h) 40%,#fff)}
.face .line{fill:none;stroke:color-mix(in srgb,var(--h) 40%,#fff);stroke-width:1.7;stroke-linecap:round}
.face .blush{fill:var(--h);opacity:.5}
.face .lens{fill:none;stroke:color-mix(in srgb,var(--h) 55%,#fff);stroke-width:1.8}
.face .spine{fill:color-mix(in srgb,var(--h) 55%,#0a0f1f);stroke:var(--h);stroke-width:1}
.face .badge{fill:#0b1122;stroke:var(--h);stroke-width:1.5}
.face .art{fill:none;stroke:var(--h);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.face .tick{display:none}
.face.back .tick{display:inline}
.face .tick circle{fill:var(--h);stroke:#0b1122;stroke-width:1.5}
.face .tick path{fill:none;stroke:#07101c;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.face.work::before{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid color-mix(in srgb,var(--h) 20%,transparent);border-top-color:var(--h);animation:spin 1.4s linear infinite}
.face.work .art{animation:artlift 1.1s var(--ease) infinite alternate}
.face.h-researcher.work .art{animation:pageturn 2.2s var(--ease) infinite}
@keyframes artlift{from{transform:translateY(1.2px)}to{transform:translateY(-1.6px)}}
@keyframes pageturn{0%,55%{transform:scaleX(1)}75%{transform:scaleX(-1)}100%{transform:scaleX(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
.orb.o24{width:24px;height:24px;flex:none}
.orb.o30{width:30px;height:30px;flex:none}

/* A · the byline: face + name + what code knows */
.by{display:flex;align-items:center;gap:8px;min-height:28px;font:600 15px var(--ui)}
.by .nm{color:var(--h,var(--ink))}
.by .mt{font:400 13px var(--ui);color:var(--ink3);white-space:nowrap}
.msg{align-self:stretch;display:flex;flex-direction:column}
.msg .tx{margin:4px 0 0;font:400 17px/1.42 var(--ui);white-space:pre-line;text-wrap:pretty}
.said{align-self:stretch;padding:12px 14px 14px;border-radius:22px;background:color-mix(in srgb,var(--h) 9%,rgba(255,255,255,.05));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--h) 32%,transparent),0 1px 0 var(--card-hi) inset;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.said.enter{animation:said .38s var(--ease) both}
@keyframes said{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
.read{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px}
.read .k{font:400 13px var(--ui);color:var(--ink3)}
.read span:not(.k){display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:13px;font:500 13px var(--ui);color:var(--ink2);background:color-mix(in srgb,var(--ink) 9%,transparent);white-space:nowrap}
.working{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:start;padding:14px 14px 12px;border-radius:22px;background:color-mix(in srgb,var(--h) 6%,rgba(255,255,255,.04));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--h) 22%,transparent)}
.working .wh{display:flex;align-items:baseline;gap:8px;font:600 15px var(--ui)}
.working .wh .nm{color:var(--h)}
.clock{margin-left:auto;font:600 13px var(--round);font-variant-numeric:tabular-nums;color:var(--ink3)}
.working .read{margin-top:6px}
.roster{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.seat{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:14px 6px 10px;border-radius:20px;background:color-mix(in srgb,var(--h) 6%,rgba(255,255,255,.04));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--h) 24%,transparent)}
.seat .face{margin-bottom:4px}
.seat b{font:600 15px var(--ui);color:var(--h)}
.seat .doing{font:400 13px/1.3 var(--ui);color:var(--ink2);min-height:34px}
.seat .st{font:600 13px var(--ui);color:var(--ink3);font-variant-numeric:tabular-nums}
.seat.done{background:color-mix(in srgb,var(--h) 11%,rgba(255,255,255,.05));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--h) 44%,transparent)}
.seat.done .st{color:var(--ink)}
.from3{margin:6px 0 0;font:400 13px/1.35 var(--ui);color:var(--ink3)}
.contrib{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.cbtn{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 12px 0 7px;border-radius:22px;font:600 15px var(--ui);color:var(--ink);background:color-mix(in srgb,var(--h) 11%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--h) 36%,transparent)}
.cbtn.on{background:color-mix(in srgb,var(--h) 22%,transparent);box-shadow:inset 0 0 0 1.5px var(--h)}
.joint-tx{margin:4px 0 0;font:400 17px/1.42 var(--ui);white-space:pre-line;text-wrap:pretty}

/* the sheet: one contributor's own words, over a scrim that also covers the dock (62's behind + scrim) */
.behind{pointer-events:none;filter:blur(2px);opacity:.55}
.scrim{position:fixed;inset:0;z-index:25;background:rgba(3,5,12,.55);animation:fadein .3s ease both}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;max-width:402px;margin:0 auto;padding:8px 16px calc(22px + env(safe-area-inset-bottom,0px));border-radius:30px 30px 0 0;background:rgba(20,25,46,.95);backdrop-filter:blur(30px) saturate(1.4);-webkit-backdrop-filter:blur(30px) saturate(1.4);box-shadow:0 0 0 .5px var(--tab-ring),0 1px 0 var(--card-hi) inset,0 -24px 60px -20px rgba(0,0,0,.85);animation:sheetin .36s var(--ease) both}
@keyframes sheetin{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.grab{width:36px;height:5px;border-radius:3px;background:color-mix(in srgb,var(--ink) 30%,transparent);margin:0 auto 12px}
.shead{display:grid;grid-template-columns:52px minmax(0,1fr) 44px;gap:12px;align-items:center}
.shead b{display:block;font:700 20px/1.2 var(--ui);color:var(--h)}
.shead span{display:block;font:400 13px/1.3 var(--ui);color:var(--ink3)}
.asked{margin:14px 0 0;padding:10px 12px;border-radius:16px;background:var(--well);font:400 15px/1.4 var(--ui);color:var(--ink2)}
.asked i{font-style:normal;color:var(--ink3);font-size:13px;display:block}
.own{margin:12px 2px 0;font:400 17px/1.45 var(--ui);white-space:pre-line}
.sfoot{display:flex;flex-direction:column;gap:8px;margin-top:14px}

/* B · the bench: who is on this thread, lit while working, ticked when back */
.view.benched{padding-bottom:calc(var(--dock-h) + env(safe-area-inset-bottom,0px) + 150px)}
.bench{position:fixed;left:12px;right:12px;bottom:calc(var(--dock-h) + env(safe-area-inset-bottom,0px) + 66px);z-index:18;max-width:378px;margin:0 auto;display:flex;align-items:center;gap:8px;min-height:56px;padding:4px 10px 4px 8px;border-radius:28px;background:var(--tab);backdrop-filter:blur(24px) saturate(1.5);-webkit-backdrop-filter:blur(24px) saturate(1.5);box-shadow:0 0 0 .5px var(--tab-ring),0 1px 0 var(--card-hi) inset,0 12px 30px -14px rgba(0,0,0,.6);animation:benchin .32s var(--ease) both}
@keyframes benchin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.bseat{display:flex;align-items:center;gap:8px;min-height:48px;min-width:0;flex:1;text-align:left;border-radius:22px;padding:0 4px}
.bseat .bt{min-width:0}
.bseat b{display:block;font:600 13px/1.25 var(--ui);color:var(--h);white-space:nowrap}
.bseat small{display:block;font:400 13px/1.25 var(--ui);color:var(--ink2);font-variant-numeric:tabular-nums}
.bseat.solo small{white-space:normal}
.from{margin-top:10px;border-radius:18px;background:color-mix(in srgb,var(--h) 8%,rgba(255,255,255,.04));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--h) 30%,transparent);overflow:hidden}
.from + .from{margin-top:6px}
.from .fh{display:flex;align-items:center;gap:8px;width:100%;min-height:48px;padding:0 10px 0 8px;font:600 15px var(--ui);text-align:left}
.from .fh .nm{color:var(--h)}
.from .fh .mt{margin-left:auto;font:400 13px var(--ui);color:var(--ink3);white-space:nowrap}
.from .fh .ic{color:var(--ink3);width:16px;height:16px}
.from .fb{padding:0 14px 12px;font:400 15px/1.42 var(--ui);white-space:pre-line}
.from .fb .read{margin-top:8px}
.from.open{animation:said .34s var(--ease) both}

/* C · the stage: a panel per agent rises as it starts and fills as it returns */
.stg{margin-top:12px;padding:12px;border-radius:26px;background:color-mix(in srgb,var(--ink) 4%,transparent);box-shadow:inset 0 0 0 1px var(--sep)}
.stg .sl{display:flex;align-items:center;gap:8px;margin:0 4px;font:600 13px var(--ui);color:var(--ink3)}
.stg .sl .clock{font-size:13px}
.panels{display:grid;gap:8px;margin-top:10px}
.panels.n3{grid-template-columns:repeat(3,minmax(0,1fr))}
.pan{position:relative;display:flex;flex-direction:column;gap:6px;width:100%;padding:12px 10px 12px;border-radius:20px;min-height:204px;text-align:left;background:color-mix(in srgb,var(--h) 8%,var(--card));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--h) 34%,transparent),0 1px 0 var(--card-hi) inset,var(--card-shadow);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));animation:panrise .44s var(--ease) both;animation-delay:calc(var(--i,0) * 90ms)}
@keyframes panrise{from{opacity:0;transform:translateY(22px) scale(.96)}to{opacity:1;transform:none}}
.pan .pn{font:600 15px var(--ui);color:var(--h)}
.pan .ps{font:600 13px var(--ui);color:var(--ink3);font-variant-numeric:tabular-nums}
.pan .pw{font:400 13px/1.35 var(--ui);color:var(--ink2)}
.pan .pf{font:400 15px/1.35 var(--ui);color:var(--ink);text-wrap:pretty}
.pan.done{background:color-mix(in srgb,var(--h) 13%,var(--card));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--h) 50%,transparent),0 1px 0 var(--card-hi) inset,var(--card-shadow)}
.pan.done .ps{color:var(--ink)}
.pan .skel{height:11px}
.pan.wide{min-height:0;padding:14px 16px 16px}
.pan.wide .ptop{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center}
.pan.wide .pn{font-size:17px}
.pan.wide .pf{font-size:17px;line-height:1.42;white-space:pre-line}
.stg.quiet{padding:10px 12px}
.joint{padding:12px 14px 14px;border-radius:22px;background:var(--card);box-shadow:0 0 0 .5px var(--card-ring),0 1px 0 var(--card-hi) inset,var(--card-shadow);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));animation:collapse .46s var(--ease) both}
@keyframes collapse{from{opacity:0;transform:translateY(-26px) scale(.94)}to{opacity:1;transform:none}}
.joint .jh{display:flex;align-items:center;gap:0}
.joint .jh .fb44{width:44px;height:44px;display:grid;place-items:center;border-radius:22px}
.joint .jh .fb44.on{background:color-mix(in srgb,var(--h) 20%,transparent);box-shadow:inset 0 0 0 1.5px var(--h)}
.joint .jh .jl{margin-left:6px;font:600 15px var(--ui)}
.joint .jh .jl span{display:block;font:400 13px var(--ui);color:var(--ink3)}
.dim{opacity:.45}
.glasskey{padding:16px 18px;border-radius:20px;background:var(--card);box-shadow:0 0 0 .5px var(--card-ring),0 1px 0 var(--card-hi) inset,var(--card-shadow);animation:panrise .44s var(--ease) both}
.glasskey .gk{font:600 13px var(--ui);color:var(--ink3)}
.glasskey .gv{margin-top:4px;font:700 34px/1.1 var(--round);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.glasskey .gs{margin-top:4px;font:400 15px var(--ui);color:var(--ink2)}

.note h3{margin:0 0 4px;font:600 13px var(--ui);color:var(--ink)}
.note .have{color:var(--ink)}
.note .tag{display:inline-block;font-weight:600}
.note td:first-child{width:52px}
/* ================= copied from mockup 63 (the rail and the D pieces) ================= */
.brail{display:flex;gap:8px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.mini{flex:none;min-width:112px;min-height:56px;padding:8px 12px;border-radius:16px;text-align:left;background:color-mix(in srgb,var(--ink) 7%,transparent);box-shadow:0 0 0 .5px var(--card-ring);opacity:.8}
.mini + .mini{opacity:.6}.mini + .mini + .mini{opacity:.45}
.mini b{display:block;font:600 15px var(--ui)}
.mini span{display:block;font:400 13px var(--ui);color:var(--ink3)}
/* ================= round 2 (63): the living core, D and E ================= */
#screens{display:flex;flex-wrap:wrap}
#screens button{flex:1 1 auto;min-width:0;padding:7px 2px;white-space:nowrap;letter-spacing:-.01em}
.corebox{position:relative;display:block;flex:none}
.corebox canvas{display:block;width:100%;height:100%}
canvas.core[data-core="off"]{filter:grayscale(1) brightness(.62)}
.state.center{justify-content:center;margin:0}
.who{display:flex;flex-direction:column;align-items:center;min-height:44px;min-width:44px;border-radius:22px}
.who .nm{display:inline-flex;align-items:center;gap:1px;min-height:24px;font:600 17px/1.2 var(--ui);color:var(--ink)}
.who .nm .ic{width:15px;height:15px;color:var(--ink3);stroke-width:2.4}
.who.row{flex-direction:row;gap:6px;padding-right:6px}

/* the page at rest on its newest line (both blends) */
.view.dz:not([hidden]),.view.ez:not([hidden]){display:flex;flex-direction:column;min-height:100vh}
.view.dz > .thread,.view.ez > .thread{margin-top:auto;padding-top:16px}
.view.ez.hist > .thread{margin-top:0}
.view.dz .note,.view.ez .note{margin:10px 0 0}

/* D · the head: Nova's face, as a contact's face heads a Messages thread */
.dhdr{position:sticky;top:var(--switch-h);z-index:12;margin:-10px -16px 0;padding:2px 16px 6px;display:flex;flex-direction:column;align-items:center;gap:0}
.dhdr::before{content:"";position:absolute;inset:0 0 -18px;z-index:-1;background:rgba(6,8,18,.9);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);-webkit-mask-image:linear-gradient(#000 calc(100% - 20px),transparent);mask-image:linear-gradient(#000 calc(100% - 20px),transparent)}
.dhdr .state{margin-top:0}

/* D · the stage that rises: B's stage, as glass over the thread while she speaks (no scrim) */
.dstage{position:absolute;top:calc(100% + 2px);left:12px;right:12px;z-index:13;padding:0 14px 16px;border-radius:28px;background:rgba(20,25,46,.82);backdrop-filter:blur(30px) saturate(1.5);-webkit-backdrop-filter:blur(30px) saturate(1.5);box-shadow:0 0 0 .5px var(--tab-ring),0 1px 0 var(--card-hi) inset,0 26px 54px -20px rgba(0,0,0,.92);transform-origin:50% 0;animation:stagein .42s var(--ease) .06s both}
@keyframes stagein{from{opacity:0;transform:translateY(-14px) scale(.96);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
.sthead{display:flex;align-items:center;gap:8px;min-height:44px;font:600 13px var(--ui);color:var(--ink2)}
.sthead > span:first-child{display:inline-flex;align-items:center;gap:6px;min-width:0;white-space:nowrap;overflow:hidden}
.sthead .ic{width:16px;height:16px;flex:none}
.sthead .sub2{margin-left:auto;font-weight:400;color:var(--ink3);white-space:nowrap}
.tuck{width:44px;height:44px;margin:0 -10px 0 auto;border-radius:22px;display:grid;place-items:center;color:var(--ink2)}
.spanel{display:block;width:100%;text-align:left;padding:12px 14px;border-radius:18px;background:color-mix(in srgb,var(--ink) 6%,transparent);box-shadow:0 0 0 .5px var(--card-ring)}
.spanel .pl{display:flex;align-items:center;justify-content:space-between;font:600 13px var(--ui);color:var(--ink2)}
.spanel .pl .ic{width:16px;height:16px;color:var(--ink3)}
.dstage .line{margin:12px 2px 0}

/* the stage, settled into the thread: the last panel, the others, and Replay */
.settled{padding:0 14px 14px;border-radius:var(--r);background:var(--card);box-shadow:0 0 0 .5px var(--card-ring),0 1px 0 var(--card-hi) inset,var(--card-shadow);backdrop-filter:blur(var(--blur)) saturate(1.4);-webkit-backdrop-filter:blur(var(--blur)) saturate(1.4)}
.settled .brail{margin-top:8px;flex-wrap:nowrap}
.settled .brail .mini{opacity:1;min-width:0;flex:1 1 0}
.mini.rp b{display:flex;align-items:center;gap:4px}
.mini.rp .ic{width:14px;height:14px}
.bars7.sm{height:58px;margin-top:10px;gap:8px}

/* ================= 67 · round 2: the blend ================= */
#screens button{padding:7px 1px}
#beats{grid-auto-flow:column;grid-auto-columns:1fr}
#beats[hidden]{display:none}
#beats button.play{flex:none}
.view.dz{padding-bottom:calc(var(--dock-h) + env(safe-area-inset-bottom,0px) + 86px)}
.view.dz.benched{padding-bottom:calc(var(--dock-h) + env(safe-area-inset-bottom,0px) + 150px)}
.view .note{font-size:13px}

/* the thread: Nova's byline once per turn (A), the code-written hand-over in the quieter ink */
.msg .tx.hand{margin-top:2px;font:400 15px/1.4 var(--ui);color:var(--ink2)}
.msg .tx + .tx{margin-top:8px}
.msg .foot{margin-top:6px}

/* "From the Coach": B's idea in A's glass, closed to one row; a tap puts its own words on the stage (screen 4) */
.from .fh{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;min-height:56px;padding:6px 12px 6px 10px}
.from .ft{min-width:0}
.from .ft b{display:block;font:600 15px/1.25 var(--ui)}
.from .ft small{display:block;font:400 13px/1.3 var(--ui);color:var(--ink3)}
.from.on{box-shadow:inset 0 0 0 1.5px var(--h)}

/* the bench (B's place) with A's colour separation: each seat is its own tinted glass, in its own hue */
.bench{gap:6px;padding:4px}
.bseat{flex:1 1 0;min-height:48px;gap:8px;padding:0 10px 0 7px;border-radius:24px;background:color-mix(in srgb,var(--h) 11%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--h) 34%,transparent);transition:background-color .2s var(--ease),box-shadow .2s var(--ease)}
.bseat.on{background:color-mix(in srgb,var(--h) 22%,transparent);box-shadow:inset 0 0 0 1.5px var(--h)}
.bseat small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bench .via{flex:none;display:grid;place-items:center;width:12px;color:var(--ink3)}
.bench .via .ic{width:14px;height:14px}

/* 2 · the peek: what one agent is doing right now, grown from its seat */
.scrim.soft{z-index:17;background:rgba(3,5,12,.46)}
.peek{position:fixed;left:12px;right:12px;bottom:calc(var(--dock-h) + env(safe-area-inset-bottom,0px) + 128px);z-index:30;max-width:378px;margin:0 auto;padding:8px 14px 14px;border-radius:28px;background:rgba(20,25,46,.92);backdrop-filter:blur(30px) saturate(1.5);-webkit-backdrop-filter:blur(30px) saturate(1.5);box-shadow:0 0 0 .5px var(--tab-ring),inset 0 0 0 1px color-mix(in srgb,var(--h) 30%,transparent),0 1px 0 var(--card-hi) inset,0 24px 50px -18px rgba(0,0,0,.9);transform-origin:26% 100%;animation:peekin .28s var(--ease) both}
@keyframes peekin{from{opacity:0;transform:translateY(10px) scale(.95);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.pk-head{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;gap:12px;align-items:center}
.pk-head b{display:block;font:700 20px/1.2 var(--ui);color:var(--h)}
.pk-head span{display:block;font:400 13px/1.3 var(--ui);color:var(--ink3);font-variant-numeric:tabular-nums}
.pk-q{margin:12px 0 0;padding:9px 12px;border-radius:16px;background:var(--well);font:400 15px/1.35 var(--ui);color:var(--ink)}
.pk-q i{display:block;font:400 13px var(--ui);font-style:normal;color:var(--ink3)}
.pk-k{margin:12px 2px 4px;font:600 13px var(--ui);color:var(--ink3)}
.pk-list{list-style:none;margin:0;padding:0}
.pk-list li{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:8px;align-items:center;min-height:30px;font:400 15px var(--ui)}
.pk-list li .ic{width:16px;height:16px;color:var(--ink2);stroke-width:2.4}
.pk-list li span:last-child{font:400 13px var(--ui);color:var(--ink3);white-space:nowrap}
.pk-ask{display:grid;grid-template-columns:30px minmax(0,1fr) 16px;gap:10px;align-items:center;width:100%;min-height:56px;padding:8px 10px;border-radius:18px;text-align:left;background:color-mix(in srgb,var(--h) 10%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--h) 32%,transparent)}
.pk-ask b{display:block;font:600 15px var(--ui);color:var(--h)}
.pk-ask small{display:block;font:400 13px/1.3 var(--ui);color:var(--ink2)}
.pk-ask .ic{width:16px;height:16px;color:var(--ink3)}
.pk-foot{margin:10px 2px 0;font:400 13px/1.35 var(--ui);color:var(--ink3)}

/* the stage (63 D) carrying a data panel; the provenance chip names whose finding it shows */
.dstage{max-height:calc(100vh - var(--switch-h) - 104px - var(--dock-h) - 70px);overflow-y:auto;scrollbar-width:none}
.sthead .prov{display:inline-flex;align-items:center;gap:6px;margin-left:auto;font:600 13px var(--ui);color:var(--h,var(--ink2));white-space:nowrap}
.sthead .prov .face + .face{margin-left:-6px}
.prov .face,.srh .face,.mini .face{height:var(--s)!important;align-self:center}
.sthead .tuck{margin-left:0}
.sthead > span:first-child + .tuck{margin-left:auto}
.bench.n3 .bseat{gap:5px;padding:0 6px 0 4px}
.bench.n3 .bseat b{letter-spacing:-.01em}
.sthead #btl{font-variant-numeric:tabular-nums}

/* the spoken line: said, saying, still to say; the part being pointed at is underlined in the finder's hue */
.spoken{margin:10px 2px 0;font:400 20px/1.34 var(--serif);text-wrap:pretty}
.spoken span{transition:color .3s var(--ease)}
.spoken .done{color:var(--ink2)}
.spoken .now{color:var(--ink)}
.spoken .later{color:var(--ink3)}
.spoken u{text-decoration:none}
.spoken .done u,.spoken .now u{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px;text-decoration-color:var(--h,var(--ink))}
.spoken .done u{text-decoration-color:color-mix(in srgb,var(--h,var(--ink)) 45%,transparent)}

/* the lit/unlit grammar every data panel shares */
.lx{transition:opacity .32s var(--ease),background-color .32s var(--ease),box-shadow .32s var(--ease),color .32s var(--ease)}

/* the session panel: Monday's workout, read by code from the log */
.sess{padding:8px 12px 8px;border-radius:18px;background:color-mix(in srgb,var(--ink) 6%,transparent);box-shadow:0 0 0 .5px var(--card-ring)}
.sh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font:600 13px var(--ui);color:var(--ink2)}
.sh span + span{font-weight:400;color:var(--ink3)}
.hero{margin:6px 0 2px;padding:8px 10px 6px;border-radius:14px}
.hero .ht{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hero .ht b{font:600 17px var(--ui)}
.kg{display:inline-flex;align-items:baseline;gap:3px;height:28px;padding:0 10px;border-radius:14px;align-items:center;font:600 15px var(--ui);color:var(--ink2)}
.kg em{font:700 20px var(--round);font-style:normal;color:var(--ink);font-variant-numeric:tabular-nums}
.bars3{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;height:64px;margin:12px 44px 0 0}
.set{position:relative;height:100%}
.set .bar,.set .gap{position:absolute;left:0;right:0;bottom:0;border-radius:9px 9px 3px 3px}
.set .bar{display:flex;justify-content:center;padding-top:5px;background:color-mix(in srgb,var(--ink) 24%,transparent);font:700 17px var(--round);color:var(--ink);font-variant-numeric:tabular-nums}
.set .bar em{font-style:normal}
.set .gap{border:1.5px dashed transparent;opacity:0}
.tgt{position:absolute;left:0;right:-44px;height:0;border-top:1.5px dashed color-mix(in srgb,var(--ink) 38%,transparent)}
.tgt b{position:absolute;right:0;top:-19px;font:600 13px var(--ui);color:var(--ink3);white-space:nowrap}
.caps3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:6px 44px 0 0;font:400 13px/1.25 var(--ui);color:var(--ink3);text-align:center}
.lift{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:26px;padding:0 10px;font:400 15px var(--ui)}
.lift span{font:400 13px var(--ui);color:var(--ink3);font-variant-numeric:tabular-nums;white-space:nowrap}
/* beat 1 · the lift */
.sess[data-beat="1"] .lift,.sess[data-beat="2"] .lift,.sess[data-beat="3"] .lift{opacity:.38}
.sess[data-beat="1"] .hero{background:color-mix(in srgb,var(--coach) 13%,transparent);box-shadow:inset 0 0 0 1.5px var(--coach)}
.sess[data-beat="1"] .hero .ht b{color:var(--coach)}
/* beat 2 · the set */
.sess[data-beat="2"] .hero,.sess[data-beat="3"] .hero{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--coach) 30%,transparent)}
.sess[data-beat="2"] .s1,.sess[data-beat="2"] .s2,.sess[data-beat="2"] .c1,.sess[data-beat="2"] .c2{opacity:.36}
.sess[data-beat="2"] .s3 .bar{background:var(--coach);color:#2b0c08;box-shadow:0 0 0 3px color-mix(in srgb,var(--coach) 26%,transparent)}
.sess[data-beat="2"] .c3{color:var(--coach);font-weight:600}
/* beat 3 · the number */
.sess[data-beat="3"] .kg{background:color-mix(in srgb,var(--coach) 20%,transparent);box-shadow:inset 0 0 0 1.5px var(--coach);color:var(--ink)}
.sess[data-beat="3"] .set .gap{opacity:1;height:88.9%;border-color:var(--coach)}
.sess[data-beat="3"] .tgt{border-top:2px solid var(--coach)}
.sess[data-beat="3"] .tgt b{color:var(--coach)}
.sess.sm .lift{display:none}
.settled .spanel .sess{background:none;box-shadow:none;padding:0}
.sess.sm .bars3{height:56px}
.sess.sm .hero{margin:4px 0 0;padding:4px 2px 2px}

/* the joint panel: three sources composed as one, lit one at a time */
.jp{display:grid;gap:8px}
.jp2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.src{padding:9px 10px 10px;border-radius:16px;background:color-mix(in srgb,var(--ink) 6%,transparent);box-shadow:0 0 0 .5px var(--card-ring)}
.srh{display:flex;align-items:center;gap:6px;min-height:24px;font:600 13px var(--ui)}
.srh b{font-weight:600;color:var(--h)}
.srh span{margin-left:auto;font-weight:400;color:var(--ink3);white-space:nowrap}
.srm{display:block;margin-top:6px;font:400 13px/1.3 var(--ui);color:var(--ink3)}
.chart{display:block;width:100%;height:40px;margin-top:6px;overflow:visible}
.chart .press{fill:none;stroke:color-mix(in srgb,var(--ink) 40%,transparent);stroke-width:1.6;stroke-dasharray:4 4}
.chart .row{fill:none;stroke:var(--ink2);stroke-width:2.6;stroke-linecap:round}
.chart circle{fill:var(--ink2)}
.leg{display:flex;flex-wrap:wrap;gap:2px 14px;margin-top:4px;font:400 13px var(--ui);color:var(--ink3)}
.leg b{font-weight:600;color:var(--ink2)}
.quote{margin:6px 0 0;font:400 15px/1.38 var(--serif);color:var(--ink)}
.quote mark{background:transparent;color:inherit;border-radius:4px;padding:0 1px}
.fq{display:grid;gap:6px;margin-top:8px}
.fq span{display:block;font:400 13px var(--ui);color:var(--ink2)}
.fq i{display:block;height:10px;margin-top:3px;border-radius:5px;background:color-mix(in srgb,var(--ink) 26%,transparent)}
.jp[data-beat="1"] .src:not(.s-coach),.jp[data-beat="2"] .src:not(.s-librarian),.jp[data-beat="3"] .src:not(.s-researcher){opacity:.38}
.jp[data-beat="1"] .s-coach,.jp[data-beat="2"] .s-librarian,.jp[data-beat="3"] .s-researcher{background:color-mix(in srgb,var(--h) 11%,transparent);box-shadow:inset 0 0 0 1.5px var(--h)}
.jp[data-beat="1"] .chart .row{stroke:var(--coach)}
.jp[data-beat="1"] .chart circle{fill:var(--coach)}
.jp[data-beat="1"] .leg b{color:var(--coach)}
.jp[data-beat="2"] mark{background:color-mix(in srgb,var(--librarian) 32%,transparent);box-shadow:0 0 0 2px color-mix(in srgb,var(--librarian) 32%,transparent)}
.jp[data-beat="3"] .fq .two i{background:var(--researcher)}
.jp[data-beat="3"] .fq .two span{color:var(--ink)}

/* the calendar panel (C's alone view), lit in white: Nova's own */
.cal{padding:10px 14px 12px;border-radius:18px;background:color-mix(in srgb,var(--ink) 6%,transparent);box-shadow:0 0 0 .5px var(--card-ring)}
.calbig{display:flex;align-items:center;gap:14px;margin-top:6px}
.calbig .num{font-size:64px;line-height:1}
.calbig b{display:block;font:600 17px var(--ui)}
.calbig small{display:block;font:400 15px var(--ui);color:var(--ink2);font-variant-numeric:tabular-nums}
.tl{position:relative;height:28px;margin-top:14px;border-radius:8px;background:color-mix(in srgb,var(--ink) 7%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ink) 12%,transparent)}
.tl .blk{position:absolute;top:0;bottom:0;border-radius:7px;background:var(--ink);box-shadow:0 0 0 3px color-mix(in srgb,var(--ink) 22%,transparent)}
.tl .free{position:absolute;top:4px;bottom:4px;border-radius:5px;background-image:repeating-linear-gradient(135deg,transparent 0 5px,color-mix(in srgb,var(--ink) 16%,transparent) 5px 7px)}
.tlx{display:flex;justify-content:space-between;margin-top:5px;font:400 13px var(--round);color:var(--ink3);font-variant-numeric:tabular-nums}

/* the settled card: what the stage showed, kept in the thread; minis wear their finder's hue */
.settled{animation:settle .42s var(--ease) both}
@keyframes settle{from{opacity:0;transform:translateY(-18px) scale(.97);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
.settled .brail.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.settled .mini{display:block}
.mini.hu{background:color-mix(in srgb,var(--h) 10%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--h) 30%,transparent)}
.mini.hu b{display:flex;align-items:center;gap:6px;color:var(--h)}

/* 4 · the open view (C): one contributor's own words, raised onto the stage */
.ownv{padding:12px 14px 14px;border-radius:22px;background:color-mix(in srgb,var(--h) 9%,rgba(255,255,255,.04));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--h) 34%,transparent)}
.ownv .ot{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;align-items:center}
.ownv .ot b{display:block;font:700 20px/1.2 var(--ui);color:var(--h)}
.ownv .ot span{display:block;font:400 13px/1.3 var(--ui);color:var(--ink3)}
.ownv .oq{margin:10px 0 0;font:400 13px/1.35 var(--ui);color:var(--ink3)}
.ownv .oq b{font-weight:600;color:var(--ink2)}
.ownv .ow{margin:8px 0 0;font:400 17px/1.42 var(--ui);white-space:pre-line;text-wrap:pretty}
.ownv .pk-ask{margin-top:10px}
.ownv .erow{margin-top:8px}
.dim{opacity:.4}

/* 7 · the rules page */
.rtop{display:flex;align-items:center;min-height:44px}
.rback{display:inline-flex;align-items:center;gap:2px;height:44px;padding:0 12px 0 4px;border-radius:22px;font:400 17px var(--ui);color:var(--ink)}
.rback .ic{width:20px;height:20px;transform:scaleX(-1)}
.rt{margin:6px 4px 2px;font:700 34px/1.1 var(--ui);letter-spacing:-.025em}
.rstand{margin:6px 4px 0;font:400 20px/1.3 var(--serif);color:var(--ink);text-wrap:balance}
.rk{display:block;margin:22px 4px 8px;font:600 13px var(--ui);color:var(--ink3)}
.rule{display:grid;grid-template-columns:minmax(0,1fr) 128px;gap:12px;align-items:center;padding:12px 12px 12px 14px;border-radius:20px;background:var(--card);box-shadow:0 0 0 .5px var(--card-ring),0 1px 0 var(--card-hi) inset}
.rule + .rule{margin-top:8px}
.rule b{display:block;font:600 17px/1.25 var(--ui)}
.rule .rq{display:block;margin-top:4px;font:400 15px/1.3 var(--ui);color:var(--ink2)}
.rule .rq i{font-style:normal;color:var(--ink3)}
.tiny{height:78px;padding:8px 10px;border-radius:14px;background:color-mix(in srgb,var(--ink) 6%,transparent);box-shadow:0 0 0 .5px var(--card-ring);display:flex;flex-direction:column;justify-content:center}
.tiny .num{font-size:28px}
.tiny small{font:400 13px var(--ui);color:var(--ink3)}
.tiny svg{width:100%;height:46px;overflow:visible}
.tiny .t3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-items:end;height:48px}
.tiny .t3 i{display:block;border-radius:5px 5px 2px 2px;background:color-mix(in srgb,var(--ink) 26%,transparent)}
.tiny .t3 i.on{background:var(--coach)}
.rule.none{grid-template-columns:minmax(0,1fr)}
.rule.none .rsay{margin:8px 0 0;font:400 17px/1.4 var(--ui)}
.rule.none .rnone{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font:600 13px var(--ui);color:var(--ink3)}
.always{list-style:none;margin:0;padding:4px 16px;border-radius:20px;background:var(--card);box-shadow:0 0 0 .5px var(--card-ring),0 1px 0 var(--card-hi) inset}
.always li{padding:11px 0;font:400 15px/1.4 var(--ui)}
.always li + li{border-top:1px solid var(--sep)}
.always li b{font-weight:600}
.view.rules{padding-bottom:calc(var(--dock-h) + env(safe-area-inset-bottom,0px) + 24px)}

@media (prefers-reduced-motion:reduce){
  .face.work::before,.face.work .art,.skel,.glyph i,.novabtn .ring{animation:none!important}
  .face.work::before{border-color:var(--h)}
  .said.enter,.bench,.peek,.settled,.dstage,.rise{animation:fade .3s ease both!important}
  @keyframes fade{from{opacity:0}to{opacity:1}}
}
</style>
</head>

    before:'<button class="earlier">Earlier this week · 24</button><span class="day">Yesterday</span>'+you('How did I sleep this week?','21:40')+turnNova('21:40',null,'Six of seven nights were over seven hours. Tuesday was the short one, at 6 h 10.'),
    q1:'<span class="day">Today</span>'+you(Q1,'08:12'),
    q1b:null,
    handOnly:turnNova('08:12',HAND1),
    answered:turnNova('08:12',HAND1,SUM1,coachFrom()+'<span class="meta foot">08:13 · answered from the Coach</span>'),
    answeredOn:turnNova('08:12',HAND1,SUM1,coachFrom(1)+'<span class="meta foot">08:13 · answered from the Coach</span>'),
    q2:'<span class="day">Today</span>'+you(Q2,'08:20'),
    joint:turnNova('08:20',HAND3,SYN,contrib()+'<span class="meta foot">08:23 · from three, the last back at 2:41</span>'),
    q3:you(Q3,'08:25'),
    alone:turnNova('08:25 · 2 s',null,'Nine in the morning. Nothing else is booked before midday.')
  };
  const thread=(inner,cls)=>'<div class="thread'+(cls?' '+cls:'')+'">'+T.before+inner+'</div>';
  const SPEAK=sline(bars(3),'Speaking','tap Nova to stop and talk');
  const TURN=sline(ico('mic'),'Your turn','tap Nova or type');

  const S=[
   {n:'Ask',nova:'talk',bench:1,tally:'<b>1 Ask.</b> His training question; Nova’s one line says whose it is, written by code from the ask list, under her byline (A) · who is working lives on the bench above the composer (B), each seat its own glass in its own hue (A’s colour): the Coach coral, lit and turning, 0:08; the Researcher blue, asked by the Coach, the arrow and “via Coach” saying so · the core at the head spins: she is waiting on them · tap a seat to see what it is doing (2) · the note above the thread lists what the server must expose (scroll up)',
    html:dhdr('think',sline(dots,'Asking the Coach','0:08'))+note(1)+thread(T.q1+T.handOnly)+benchAsk('0:08','0:02')+idleComposer},
   {n:'Working',nova:'talk',bench:1,tally:'<b>2 Working, tapped.</b> A tap on the Coach’s seat grows a small glass sheet from it (the seat stays lit, the thread steps back): how long it has been at it, what Nova asked it, what code handed it (his program, the last 6 bench sessions, Monday’s log, recovery, +3), and what it asked the Researcher, still working, one tap deeper · the last line says the one thing it cannot show: its answer is not in yet · ✕ or a tap outside puts it back into the seat',
    html:dhdr('think',sline(dots,'Asking the Coach','0:14'))+note(2)+thread(T.q1+T.handOnly)+peek+benchAsk('0:14','0:08',1)+idleComposer},
   {n:'Panel',beats:['Lift','Set','Number','Settled'],tally:['<b>3 · beat 1 of 3, the lift.</b> The Coach is back; Nova speaks its answer in three sentences, and the stage rises from under her face over the thread (63 D) with Monday’s workout, read by code from the log · on “not yet on bench” the bench press row lights, ringed in the Coach’s coral, and the other lifts step back · the stage names it in words (1 of 3 · the lift) and whose it is (from the Coach) · the bench steps aside while the stage is up · plays by itself; the beats above pin one',
      '<b>3 · beat 2 of 3, the set.</b> “Your third set on Monday stopped at 6 reps, at RPE 9.5”: set 3 fills coral and sets 1 and 2 step back; its label (Set 3, RPE 9.5) lights · the line underneath is the sentence being spoken, lit, with the part that names the light underlined in the same hue; said sentences dim, the one to come waits in grey',
      '<b>3 · beat 3 of 3, the number.</b> “Hold three sets at 80 kg until all three reach 8”: 80 kg is ringed, the 8-rep line turns solid coral, and the gap from each set up to 8 is drawn dashed, which is the whole instruction in one picture · one thing lit per sentence, and nothing lit she isn’t saying',
      '<b>3 · settled.</b> When she stops, the stage settles into the thread as a card under her reply: Monday’s bench, small, the two things she lit, and Replay · her reply is B’s short summary under A’s byline, with “From the Coach” as one row of the Coach’s glass: its face, its own words one tap away (4), that it asked the Researcher · the bench is back with both ticked and their times, until he next speaks'],
    nova:['speak','speak','speak','talk'],
    html:(b)=>dhdr('speak',SPEAK,stage3(b))+note(3)+thread(T.q1+T.answered)+idleComposer,
    settled:dhdr('idle',TURN)+note(3)+thread(T.q1+T.answered+settled3)+bench(bseat('coach','back','Back · 0:21')+via+bseat('researcher','back','via Coach · 0:12'),'On this thread: the Coach, back in 21 seconds, and the Researcher, back')+idleComposer},
   {n:'Open',nova:'talk',tally:'<b>4 Open.</b> A tap on “From the Coach” raises its own words onto the stage (C’s open view) and rings the row it came from: its face, when Nova asked and how long it took, what she asked it, its answer in its own voice, the Researcher’s answer to it one tap deeper, and the log it read, one tap to Train · ✕ or ⌃ sends it back into the row · the thread dims under it but does not move',
    html:dhdr('idle',sline(ico('mic'),'Your turn','the Coach’s own words are up'),openC)+note(4)+thread(T.q1+T.answeredOn)+idleComposer},
   {n:'Joint',beats:['Coach','Book','Study','Settled'],tally:['<b>5 · beat 1 of 3, your row.</b> A question for three. The stage carries ONE composed panel, each source in its own glass under its own face and name: the Coach’s row against pressing, the Librarian’s passage from his note, the Researcher’s finding · on “Your row has sat at 70 kg for four weeks” the Coach’s part lights coral, the row line with it; the other two step back',
      '<b>5 · beat 2 of 3, your book.</b> “Your book says a stall is the reason to change”: the Librarian’s part lights teal and the exact words in his note are highlighted, a real span of the note, not a paraphrase',
      '<b>5 · beat 3 of 3, the research.</b> “And twice a week has a small, real edge”: the Researcher’s part lights blue, the twice-a-week bar with it; its source count stays in view · the underline in the line below changes hue with the speaker of each finding',
      '<b>5 · settled.</b> A’s compact joint reply: Nova’s byline, “from three” in words, the synthesis, and the three contributors as a row of face buttons, each opening its own words as in 4 · under it the settled card, one mini per source in its hue, and Replay · the bench shows all three back with their times'],
    nova:['speak','speak','speak','talk'],
    html:(b)=>dhdr('speak',SPEAK,stage5(b))+note(5)+thread(T.q2+T.joint)+idleComposer,
    settled:dhdr('idle',TURN)+note(5)+thread(T.q2+T.joint+settled5)+bench(ORDER.map((a)=>bseat(a,'back','Back '+TOOK[a])).join(''),'On this thread: all three back').replace('class="bench"','class="bench n3"')+idleComposer},
   {n:'Alone',nova:'speak',tally:'<b>6 Alone.</b> Nova answers by herself: no hand-over, no bench, no “from” · the stage still rises, because the answer is a time: C’s calendar panel, 09:00 at size, the morning as a strip with the appointment lit in white (Nova’s own finding has no hue) and the free stretch after it · on the settle it lands in the thread like the others',
    html:dhdr('speak',SPEAK,stage6)+note(6)+thread(T.q1+T.answered+T.q3+T.alone)+idleComposer},
   {n:'Rules',nova:'talk',rules:1,tally:'<b>7 Rules of the panel.</b> His condition, “purposeful and clear and not simply more clutter”, written as the page he can open from Nova › (How Nova shows things): three cases that raise a panel (a number, a comparison, a place in his record), each with a small example; the one that does not (a plain sentence), with an example; and five rules that always hold · the same words go into the prompt, and the gate is code’s (the note at the foot)',
    html:rulesHtml}
  ];

  /* ---------- the living core: the filament engine of src/NovaCore.jsx, ported ----------
     Same seed and structure (broken circuit arcs, wisps, embers, the breathing
     heart). It changes by form and never by hue: grows with his voice while
     listening, spins while thinking, pulses with her voice while speaking,
     grey and still offline. The level is simulated here; the app has the real
     one (audioLevel). Reduced motion: one still frame. */
  const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const seeded=(seed)=>{let x=seed;return()=>(x=(x*16807)%2147483647)/2147483647;};
  function buildCore(cv){
    const size=+cv.dataset.size,dpr=Math.min(window.devicePixelRatio||1,2);
    cv.width=size*dpr;cv.height=size*dpr;const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);
    const o=size>=120?{bands:32,segs:36,arc:1.15,weight:1,chaos:1,speed:.16,embers:540,wisps:84,heart:.12}
                     :{bands:12,segs:16,arc:1.2,weight:1.1,chaos:.85,speed:.14,embers:110,wisps:14,heart:.2};
    const r=seeded(7),cx=size/2,cy=size/2,R0=size*.46;
    const bands=[];for(let b=0;b<o.bands;b++){const f=.1+.9*(b/(o.bands-1)),segs=[],n=Math.round(o.segs*(.5+r()));
      for(let i=0;i<n;i++)segs.push({a0:r()*6.283,len:.02+r()*r()*o.arc,w:.5+r()*1.6*o.weight,jit:(r()-.5)*R0*.05*o.chaos,al:(.16+r()*.5)*(1.35-.55*f),fl:r()*6.28,fs:.5+r()*2});
      bands.push({f,segs,vel:(r()-.5)*o.speed,squash:1-r()*.14*o.chaos,tilt:(r()-.5)*.5*o.chaos});}
    const embers=[];for(let i=0;i<o.embers;i++)embers.push({f:Math.pow(r(),1.25),ang:r()*6.283,sz:.35+r()*1.3,al:.15+r()*.55,tw:r()*6.28,ts:.6+r()*2.4});
    const wisps=[];for(let i=0;i<o.wisps;i++){const a=r()*6.283;wisps.push({a,b:a+(r()-.5)*2.4,f1:.25+r()*.7,f2:.25+r()*.7,bulge:(r()-.5)*1.6,al:.05+r()*.12});}
    let clock=0,last=null,grow=null,lvl=0;
    const col=(f,a)=>'hsla('+(224-f*36)+','+(90-f*10)+'%,'+Math.min(38+(1-f)*44+lvl*12,88)+'%,'+a+')';
    return function(t){
      const st=cv.dataset.core;
      lvl=(st==='listen'||st==='speak')?Math.max(0,.2+.17*Math.sin(t*6.3)+.11*Math.sin(t*14.1+1.3)+.06*Math.sin(t*2.2)):0;
      const target=st==='listen'?.95:st==='speak'?.8:.74;
      grow=grow==null?target:grow+(target-grow)*.08;
      const R=R0*(grow+(st==='speak'?lvl*.12:st==='listen'?lvl*.05:0));
      const dt=last==null?0:Math.min(t-last,.1);last=t;
      clock+=dt*(1+lvl*2.6+(st==='think'?3.2:0)+(st==='listen'||st==='speak'?.4:0));
      ctx.clearRect(0,0,size,size);ctx.globalCompositeOperation='lighter';
      for(const w of wisps){const rot=clock*.03,x1=cx+Math.cos(w.a+rot)*R*w.f1,y1=cy+Math.sin(w.a+rot)*R*w.f1*.94,x2=cx+Math.cos(w.b+rot)*R*w.f2,y2=cy+Math.sin(w.b+rot)*R*w.f2*.94;
        let mx=(x1+x2)/2+(y2-y1)*w.bulge*.3,my=(y1+y2)/2-(x2-x1)*w.bulge*.3;mx=mx*.62+cx*.38;my=my*.62+cy*.38;
        ctx.strokeStyle=col(.5,w.al*(1+lvl*1.2));ctx.lineWidth=.7;ctx.beginPath();ctx.moveTo(x1,y1);ctx.quadraticCurveTo(mx,my,x2,y2);ctx.stroke();}
      for(const b of bands){const rad=R*b.f*(1+lvl*.16*Math.sin(clock*3.1+b.f*9));ctx.save();ctx.translate(cx,cy);ctx.rotate(b.tilt);ctx.scale(1,b.squash);const rot=clock*b.vel;
        for(const s of b.segs){const fl=.55+.45*Math.sin(clock*s.fs+s.fl);ctx.strokeStyle=col(b.f,s.al*fl*(1+lvl*1.4));ctx.lineWidth=s.w*(1+lvl*.5);ctx.beginPath();ctx.arc(0,0,Math.max(.5,rad+s.jit),s.a0+rot,s.a0+rot+s.len);ctx.stroke();}
        ctx.restore();}
      for(const e of embers){const tw=.4+.6*Math.abs(Math.sin(clock*e.ts+e.tw)),x=cx+Math.cos(e.ang+clock*.05)*R*e.f,y=cy+Math.sin(e.ang+clock*.05)*R*e.f*.94;
        ctx.fillStyle=col(e.f,e.al*tw*(1+lvl*1.4));ctx.beginPath();ctx.arc(x,y,e.sz*(1+lvl*1.1)*(size<120?.8:1),0,6.29);ctx.fill();}
      if(st==='think'){ /* the spin, readable in a still: two arcs chasing round the rim */
        for(let k=0;k<2;k++){const a0=t*2.6+k*Math.PI;for(let j=0;j<16;j++){ctx.strokeStyle='hsla(190,95%,'+(60+j*2)+'%,'+(.05+j*.06)+')';ctx.lineWidth=size<120?2:3.2;ctx.lineCap='round';ctx.beginPath();ctx.arc(cx,cy,R*1.04,a0+j*.07,a0+j*.07+.08);ctx.stroke();}}}
      const pulse=1+.07*Math.sin(t*1.8)+lvl*1.15,hr=R*o.heart*pulse;
      const g=ctx.createRadialGradient(cx,cy,0,cx,cy,hr*3.2);g.addColorStop(0,'rgba(240,252,255,.95)');g.addColorStop(.18,'rgba(158,240,255,.8)');g.addColorStop(.45,'rgba(64,170,238,.35)');g.addColorStop(1,'rgba(20,60,140,0)');
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,hr*3.2,0,6.29);ctx.fill();
      ctx.globalCompositeOperation='source-over';
    };
  }
  function drawCores(t){$$('main.view:not([hidden]) canvas.core').forEach((cv)=>{if(!cv._d)cv._d=buildCore(cv);if(cv.dataset.core==='off'&&cv._still)return;cv._d(t);if(cv.dataset.core==='off')cv._still=1;});}
  if(!RM){const loop=()=>{drawCores(performance.now()/1000);requestAnimationFrame(loop);};requestAnimationFrame(loop);}

  /* ---------- the review's ruler: window.__m() ---------- */
  window.__m=function(){
    const main=$('main.view:not([hidden])'),vw=innerWidth,topY=$('.switch').offsetHeight,botY=innerHeight-$('.dock').offsetHeight;
    const vis=(el)=>{const r=el.getBoundingClientRect();return r.width>0&&r.height>0&&!el.closest('.note')&&getComputedStyle(el).visibility!=='hidden';};
    const sizes=new Set(),small=[];
    $$('*',document.body).forEach((el)=>{if(!vis(el)||el.closest('.switch'))return;if(![...el.childNodes].some((n)=>n.nodeType===3&&n.textContent.trim()))return;const fs=parseFloat(getComputedStyle(el).fontSize);sizes.add(fs);if(fs<13&&!el.closest('.tab'))small.push(el.textContent.trim().slice(0,20)+':'+fs);});
    let under=[],taps=0;$$('button',document.body).forEach((b)=>{if(!vis(b)||b.closest('.switch'))return;if(b.closest('.behind'))return;const r=b.getBoundingClientRect();if(r.bottom<topY||r.top>innerHeight)return;taps++;const m=Math.min(r.width,r.height);if(m<44&&!b.closest('.spanel')&&!b.classList.contains('field'))under.push((b.getAttribute('aria-label')||b.textContent.trim()).slice(0,24)+':'+Math.round(r.width)+'x'+Math.round(r.height));});
    const over=[];$$('*',main).forEach((el)=>{if(!vis(el))return;const r=el.getBoundingClientRect();if(r.right>vw+.5||r.left<-.5)over.push((el.className&&el.className.baseVal===undefined?el.className:el.tagName)+':'+Math.round(r.left)+'-'+Math.round(r.right));});
    const clip=[];$$('.bseat small,.bseat b,.from .ft small,.pk-ask small,.mini b,.mini span,.sh span,.srh span,.caps3 span,.lift span,.erow .t',main.parentNode).forEach((el)=>{if(!vis(el))return;if(el.scrollWidth>el.clientWidth+1)clip.push(el.textContent.trim().slice(0,24));});
    const ds=$('.dstage',main),comp=$('.composer',main);let stage=null;if(ds){const r=ds.getBoundingClientRect();stage={top:Math.round(r.top),bottom:Math.round(r.bottom),scroll:ds.scrollHeight>ds.clientHeight+1,compTop:comp?Math.round(comp.getBoundingClientRect().top):null};}
    return JSON.stringify({s:location.hash,sw:document.documentElement.scrollWidth,vw,sizes:[...sizes].sort((a,b)=>b-a),small,taps,under,over:over.slice(0,6),clip,stage,switchPx:topY});
  };

  /* ---------- the switcher: screens, and beats for the two that play ---------- */
  const phone=$('#phone');
  const mk=(id,cls,html)=>{const m=document.createElement('main');m.id=id;m.className='view '+cls;m.hidden=true;m.innerHTML=html;phone.appendChild(m);return m;};
  S.forEach((sc,i)=>{const n=i+1;
    if(sc.beats){mk('v'+n,'dz',sc.html(1));mk('v'+n+'s','dz benched',sc.settled);}
    else mk('v'+n,sc.rules?'rules':'dz'+(sc.bench?' benched':''),sc.html);});
  const sw=$('.switch'),scr=$('#screens'),bt=$('#beats'),tally=$('#tally'),nb=$('#novabtn');
  const setH=()=>document.documentElement.style.setProperty('--switch-h',(sw.offsetHeight-(parseFloat(getComputedStyle(sw).paddingTop)||0)+8)+'px');
  function renderTally(){const full=tally.dataset.full||'';
    if(tally.classList.contains('open')){tally.innerHTML=full+' <span class="tm">less</span>';return;}
    tally.innerHTML=full;if(tally.scrollWidth<=tally.clientWidth+1)return;
    const tmp=document.createElement('div');tmp.innerHTML=full;const words=tmp.textContent.split(' ');
    while(words.length>1){words.pop();tally.innerHTML=words.join(' ').replace(/[\s,.;:·]+$/,'')+'… <span class="tm">more</span>';if(tally.scrollWidth<=tally.clientWidth+1)break;}}
  tally.addEventListener('click',()=>{tally.classList.toggle('open');renderTally();setH();});
  function setBeat(main,b,labels){
    $$('[data-beat]',main).forEach((el)=>{el.dataset.beat=b;});
    $$('.spoken [data-i]',main).forEach((el)=>{const i=+el.dataset.i;el.className=i<b?'done':i===b?'now':'later';});
    const l=$('#btl',main);if(l)l.textContent=labels[b-1];
  }
  const LABELS={3:B3,5:B5};
  let s=1,beat=1,timer=null;
  function novaState(st){nb.className='novabtn'+(st==='speak'?' talk speak':' talk');nb.setAttribute('aria-label',st==='speak'?'Stop Nova and talk':'Talk to Nova');}
  function apply(opts){
    opts=opts||{};const sc=S[s-1];
    const id=sc.beats?(beat>=4?'v'+s+'s':'v'+s):'v'+s,main=document.getElementById(id),was=!main.hidden;
    $$('main.view').forEach((m)=>{m.hidden=m!==main;});
    scr.innerHTML=S.map((x,i)=>'<button data-s="'+(i+1)+'" aria-pressed="'+(i+1===s)+'">'+x.n+'</button>').join('');
    bt.hidden=!sc.beats;
    if(sc.beats){bt.innerHTML=sc.beats.map((x,i)=>'<button data-b="'+(i+1)+'" aria-pressed="'+(i+1===beat)+'">'+x+'</button>').join('')+'<button class="play" data-play="1" aria-label="Play the beats">▶</button>';
      if(beat<4)setBeat(main,beat,LABELS[s]);}
    tally.dataset.full=sc.beats?sc.tally[beat-1]:sc.tally;tally.classList.remove('open');
    novaState(sc.beats?sc.nova[beat-1]:sc.nova);
    history.replaceState(null,'','#'+s+(sc.beats?'/'+beat:''));
    try{localStorage.setItem('nova-agents-67',s+'/'+beat);}catch(e){}
    renderTally();setH();
    if(!was||opts.fresh){$$('.rise,.dstage,.bench,.peek,.settled',main).forEach((el)=>{el.style.animation='none';void el.offsetWidth;el.style.animation='';});}
    if(!was||opts.fresh)window.scrollTo(0,main.classList.contains('rules')?0:document.documentElement.scrollHeight);
    drawCores(RM?1.7:performance.now()/1000);
  }
  function stop(){if(timer){clearTimeout(timer);timer=null;}}
  function play(){stop();beat=1;apply({fresh:1});const step=()=>{timer=setTimeout(()=>{beat++;apply({fresh:beat===4});if(beat<4)step();else timer=null;},3200);};if(!RM)step();}
  scr.addEventListener('click',(e)=>{const b=e.target.closest('[data-s]');if(!b)return;stop();s=+b.dataset.s;beat=1;window.scrollTo(0,0);if(S[s-1].beats)play();else apply({fresh:1});});
  bt.addEventListener('click',(e)=>{const p=e.target.closest('[data-play]');if(p){play();return;}const b=e.target.closest('[data-b]');if(!b)return;stop();beat=+b.dataset.b;apply();});
  function fromHash(){const h=(location.hash||'').replace('#','');if(!h)return null;const p=h.split('/');const n=+p[0];if(!(n>=1&&n<=S.length))return null;s=n;const bb=+p[1];beat=S[s-1].beats&&bb>=1&&bb<=4?bb:1;return p[1]?'pinned':'play';}
  window.addEventListener('hashchange',()=>{const r=fromHash();if(r){stop();if(r==='play'&&S[s-1].beats)play();else apply({fresh:1});}});
  window.addEventListener('resize',()=>{renderTally();setH();});
  let r=fromHash();
  if(!r){try{const p=(localStorage.getItem('nova-agents-67')||'').split('/');const n=+p[0];if(n>=1&&n<=S.length){s=n;beat=S[s-1].beats?Math.min(4,Math.max(1,+p[1]||1)):1;r='pinned';}}catch(e){}}
  if(r==='play'&&S[s-1].beats)play();else apply({fresh:1});
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{renderTally();setH();});
})();
</script>
