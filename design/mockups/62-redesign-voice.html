<!--
  62 · VOICE, ROUND 1 (28 Sep 2026)
  Answers design/audits/redesign-2026-09/05-voice.md: verdict Needs work,
  findings 1 to 13, the section map in its §6. His bar: "Simplicity with all
  functionality and a beautiful aesthetic, along with ease of use MUST be the
  goal." His colour rules of 27 Sep: colour sparingly on glass, one accent on
  the primary action, never one hue for two meanings, nothing by colour alone.

  Three variations of the same demo conversation, switched at the top. Each
  has its own screens and the address says which (#a/1 to #c/7):
    A · The conversation   the page is the thread, Messages' shape: his words
                           right, Nova's left with real line breaks, panels
                           inline under the reply that raised them, the close
                           as a Coach-deck card, one composer bar.
    B · The stage          the running glass first: what Nova is showing now,
                           the spent panels as a rail, the sentence she is
                           saying; the transcript is a drawer at the foot.
    C · The simplest       one Nova, one line of what she heard, one line of
                           what she said; everything else behind a pull.
  Every variation draws the same six states (your turn, listening, thinking,
  speaking, a failed transcription, offline) and one screen that shows where
  everything else went. Each first screen ends in a note listing every
  function on today's Voice screen and its new home.

  One talk control. Today Voice has two (the 244px core and the dock's Nova
  button, which on this screen opens no microphone: audit finding 3). In A and
  B the dock's Nova button is the talk control and carries the page's one
  accent; in C the Nova button grows into the large orb on this page, so
  there is still one.

  Material: the nova-glass block copied as it is from mockup 60 (variables,
  card, tab bar, Nova button, rise, reduced motion, the switcher). Type is
  four sizes per view, 34 or 20 for the title, 17 for what was said, 15 for
  controls and secondary text, 13 for meta (A's first and last screens
  carry a fifth, the close's serif 20); numerals in SF Rounded; the tab
  label 11 (the tab bar's own, the only text under 12). Colour: cyan is the talk action and nothing
  else (the Nova button's ring, and Send while there is text to send); gold
  is waiting on his call (the close); green a done receipt; red a failure.
  Every state is also said in words and drawn in a shape (bars for
  listening, dots for thinking, the spoken words lit for speaking), so none
  depends on its hue. Chrome is monochrome. Every control is 44 or more. The
  review switcher is furniture: outside every count.

  DEMO CONTENT ONLY. The repo is public; nothing here is his data. The
  conversation, the sleep numbers, the plan change, the research topic and
  every time are invented.
-->

.composer{position:fixed;left:12px;right:12px;bottom:calc(var(--dock-h) + env(safe-area-inset-bottom,0px) + 2px);z-index:18;max-width:378px;margin:0 auto;display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:6px;align-items:end;padding:6px;border-radius:28px;background:var(--tab);backdrop-filter:blur(24px) saturate(1.5);-webkit-backdrop-filter:blur(24px) saturate(1.5);box-shadow:0 0 0 .5px var(--tab-ring),0 1px 0 var(--card-hi) inset,0 12px 30px -14px rgba(0,0,0,.5)}
.plus{width:44px;height:44px;border-radius:22px;display:grid;place-items:center;color:var(--ink);background:color-mix(in srgb,var(--ink) 10%,transparent)}
.field{min-height:44px;display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:6px 14px;border-radius:22px;background:var(--well);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ink) 12%,transparent);font:400 15px/1.3 var(--ui);color:var(--ink3);text-align:left}
.field.typed{color:var(--ink)}
.field .route{display:inline-flex;align-items:center;height:26px;padding:0 9px;border-radius:13px;font:600 13px var(--ui);color:var(--ink);background:color-mix(in srgb,var(--ink) 14%,transparent)}
.field .att{display:inline-flex;align-items:center;gap:6px;font:400 13px var(--ui);color:var(--ink3)}
.field .att i{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#3b5b7d,#1f2d4d)}
.send{width:44px;height:44px;border-radius:22px;display:grid;place-items:center;background:var(--talk);color:var(--talk-ink)}
.send .ic{stroke-width:2.6}
.composer.off .field{opacity:.6}
.meter{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 14px;border-radius:22px;background:var(--well);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ink) 12%,transparent)}
.meter .lv{flex:1;display:flex;align-items:center;gap:3px;height:24px;overflow:hidden}
.meter .lv i{flex:none;width:3px;border-radius:2px;background:var(--ink)}
.meter .tm{font:600 15px var(--round);font-variant-numeric:tabular-nums;color:var(--ink2)}
.stop{height:44px;padding:0 14px;border-radius:22px;font:600 15px var(--ui);color:var(--ink);background:color-mix(in srgb,var(--ink) 12%,transparent);white-space:nowrap}

/* a floating strip (tap to hear), glass, with its own way out */
.strip{position:fixed;left:12px;right:12px;bottom:calc(var(--dock-h) + env(safe-area-inset-bottom,0px) + 66px);z-index:19;max-width:378px;margin:0 auto;display:grid;grid-template-columns:44px minmax(0,1fr) 44px;gap:6px;align-items:center;padding:4px;border-radius:26px;background:var(--tab);backdrop-filter:blur(24px) saturate(1.5);-webkit-backdrop-filter:blur(24px) saturate(1.5);box-shadow:0 0 0 .5px var(--tab-ring),0 1px 0 var(--card-hi) inset,0 12px 30px -14px rgba(0,0,0,.6)}
.strip.hi{bottom:calc(var(--dock-h) + env(safe-area-inset-bottom,0px) + 124px)}
.strip .pb{width:44px;height:44px;border-radius:22px;display:grid;place-items:center;background:color-mix(in srgb,var(--ink) 14%,transparent);color:var(--ink)}
.strip .x{width:44px;height:44px;display:grid;place-items:center;color:var(--ink2)}
.strip .sx{font:400 13px/1.3 var(--ui);color:var(--ink2)}
.strip .sx b{display:block;font:600 15px var(--ui);color:var(--ink)}

/* failures: red, and always in words, with the next step */
.failcard{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;padding:12px 14px;border-radius:20px;background:color-mix(in srgb,var(--fail) 9%,var(--card));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--fail) 40%,transparent)}
.failcard .bang{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--fail);color:#2a0a0d;font:700 17px var(--ui)}
.failcard b{display:block;font:600 15px var(--ui)}
.failcard span{display:block;font:400 13px/1.4 var(--ui);color:var(--ink2)}
.failcard .btnrow{grid-column:2;margin-top:8px}
.offl{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;min-height:52px;padding:4px 4px 4px 12px;border-radius:26px;background:color-mix(in srgb,var(--ink) 8%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ink) 22%,transparent)}
.offl .ic{color:var(--ink2);width:22px;height:22px}
.offl .rx span{white-space:normal}
.stale{opacity:.62}

/* menus and sheets */
.behind{pointer-events:none;filter:blur(2px);opacity:.55}
.scrim{position:fixed;inset:0;z-index:15;background:rgba(3,5,12,.5)}
.menu{position:absolute;right:16px;z-index:26;width:282px;padding:6px;border-radius:24px;background:rgba(22,27,48,.9);backdrop-filter:blur(30px) saturate(1.5);-webkit-backdrop-filter:blur(30px) saturate(1.5);box-shadow:0 0 0 .5px var(--tab-ring),0 1px 0 var(--card-hi) inset,0 24px 50px -18px rgba(0,0,0,.85);transform-origin:calc(100% - 22px) 0;animation:pop .22s var(--ease) both}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.menu .mi,.cmenu .mi{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;min-height:44px;padding:0 12px;border-radius:16px;text-align:left;font:400 15px var(--ui)}
.menu .mi .v,.cmenu .mi .v{font:400 13px var(--ui);color:var(--ink3)}
.menu .sep{height:1px;margin:4px 10px;background:var(--sep)}
.menu .mh{padding:8px 12px 4px;font:600 13px var(--ui);color:var(--ink3)}
.stat{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;min-height:36px;padding:0 12px;font:400 15px var(--ui)}
.stat span{color:var(--ink3);font-size:13px}
.sw{width:51px;height:31px;border-radius:16px;background:color-mix(in srgb,var(--ink) 22%,transparent);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.3)}
.swrow{display:grid;width:100%;text-align:left;grid-template-columns:24px minmax(0,1fr) 51px;gap:10px;align-items:center;min-height:48px;padding:0 12px;font:400 15px var(--ui)}
.held{position:relative;z-index:26;padding:10px 12px;border-radius:18px;background:var(--solid);box-shadow:0 0 0 .5px var(--card-ring),0 18px 40px -16px rgba(0,0,0,.8);transform:scale(1.02)}
.cmenu{position:relative;z-index:26;width:230px;padding:6px;border-radius:20px;background:rgba(22,27,48,.92);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);box-shadow:0 0 0 .5px var(--tab-ring),0 1px 0 var(--card-hi) inset,0 20px 44px -16px rgba(0,0,0,.85);margin-top:-6px}
.lift{position:relative;z-index:26}

/* B · the stage */
.bhead{display:flex;align-items:center;justify-content:space-between;gap:10px}

.stage .bars7{height:112px;gap:10px}
.stage .big{display:flex;align-items:baseline;gap:6px;margin-top:18px}
.stage .big .num{font-size:64px}
.stage .big span{font:600 20px var(--ui);color:var(--ink2)}
.brail{display:flex;gap:8px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.mini{flex:none;min-width:112px;min-height:56px;padding:8px 12px;border-radius:16px;text-align:left;background:color-mix(in srgb,var(--ink) 7%,transparent);box-shadow:0 0 0 .5px var(--card-ring);opacity:.8}
.mini + .mini{opacity:.6}.mini + .mini + .mini{opacity:.45}
.mini b{display:block;font:600 15px var(--ui)}
.mini span{display:block;font:400 13px var(--ui);color:var(--ink3)}
.heard{margin:14px 4px 0;font:400 15px/1.35 var(--ui);color:var(--ink2);white-space:nowrap;overflow:hidden}
.heard b{font-weight:600;color:var(--ink3);margin-right:6px}
.line{margin:6px 4px 0;font:400 20px/1.34 var(--serif);text-wrap:pretty}
.line .later{color:var(--ink3)}
.stagecap{display:flex;align-items:center;gap:8px;margin:14px 4px 0;font:400 13px var(--ui);color:var(--ink2)}
.bigmeter{display:flex;align-items:center;justify-content:center;gap:5px;height:150px;margin-top:10px}
.bigmeter i{width:6px;border-radius:3px;background:var(--ink)}
.skel{display:block;border-radius:6px;background:linear-gradient(90deg,rgba(255,255,255,.06),rgba(255,255,255,.15),rgba(255,255,255,.06));background-size:200% 100%;animation:shimmer 1.4s linear infinite}
@keyframes shimmer{to{background-position:-200% 0}}
.drawer{position:fixed;left:8px;right:8px;bottom:calc(var(--dock-h) + env(safe-area-inset-bottom,0px) + 2px);z-index:18;max-width:386px;margin:0 auto;padding:6px 8px 8px;border-radius:28px;background:rgba(18,22,40,.86);backdrop-filter:blur(30px) saturate(1.5);-webkit-backdrop-filter:blur(30px) saturate(1.5);box-shadow:0 0 0 .5px var(--tab-ring),0 1px 0 var(--card-hi) inset,0 -10px 30px -16px rgba(0,0,0,.7)}
.grab{display:block;width:38px;height:5px;margin:2px auto 0;border-radius:3px;background:color-mix(in srgb,var(--ink) 34%,transparent)}
.dhead{display:flex;align-items:center;justify-content:space-between;min-height:44px;padding:0 6px 0 10px;width:100%;text-align:left}
.dhead b{font:600 15px var(--ui)}
.dhead span{font:400 13px var(--ui);color:var(--ink3)}
.drawer .composer{position:static;max-width:none;margin:0;padding:0;background:none;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none}
.drawer.open{top:calc(var(--switch-h) + env(safe-area-inset-top,0px) + 120px);overflow-y:auto;padding-bottom:12px}
.drawer.open .thread{padding:0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.view.b-stage{padding-bottom:calc(var(--dock-h) + env(safe-area-inset-bottom,0px) + 150px)}
.view.c-page{padding-bottom:calc(var(--dock-h) + env(safe-area-inset-bottom,0px) + 80px)}
.view.a-thread{padding-bottom:calc(var(--dock-h) + env(safe-area-inset-bottom,0px) + 86px)}

/* C · the simplest */
.cwrap{display:flex;flex-direction:column;align-items:center;text-align:center}
.cstate{margin-top:4px;font:400 15px var(--ui);color:var(--ink2);display:flex;align-items:center;gap:8px;min-height:24px}
.bigorb{position:relative;width:196px;height:196px;border-radius:50%;margin-top:18px;display:grid;place-items:center}
.bigorb .core{width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 42% 38%,#e9fbff 0,#8ef0ff 12%,#2f9bf0 34%,#173a99 58%,rgba(23,58,153,.2) 72%,rgba(23,58,153,0) 74%);box-shadow:0 0 60px -10px rgba(89,180,255,.7)}
.bigorb.small{width:120px;height:120px;margin-top:8px}
.bigorb .ring{position:absolute;inset:-10px;border-radius:50%;border:2px solid var(--talk);opacity:0;pointer-events:none}
.bigorb.talk::before{content:"";position:absolute;inset:-6px;border-radius:50%;box-shadow:0 0 0 2px var(--talk),0 0 26px -2px var(--talk)}
.bigorb.listen .ring{animation:ringout 1.6s var(--ease) infinite}
.bigorb.listen .ring.r2{animation-delay:.53s}.bigorb.listen .ring.r3{animation-delay:1.06s}
.bigorb.speak .ring{opacity:.5;animation:swell 1.1s ease-in-out infinite alternate}
.bigorb.think .core{animation:breathe 2.4s ease-in-out infinite}
.bigorb.off .core{filter:grayscale(1) brightness(.55)}
@keyframes breathe{0%,100%{transform:scale(.97);opacity:.85}50%{transform:scale(1.02);opacity:1}}
.clines{width:100%;margin-top:22px;text-align:left}
.clines .heard{margin:0 4px}
.clines .line{margin:8px 4px 0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pull{position:fixed;left:12px;right:12px;bottom:calc(var(--dock-h) + env(safe-area-inset-bottom,0px) + 2px);z-index:18;max-width:378px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px;padding:6px 12px;border-radius:24px;background:var(--tab);backdrop-filter:blur(24px) saturate(1.5);-webkit-backdrop-filter:blur(24px) saturate(1.5);box-shadow:0 0 0 .5px var(--tab-ring),0 1px 0 var(--card-hi) inset}
.pull span{font:400 13px var(--ui);color:var(--ink2)}
.cpanel{width:100%;margin-top:14px}

/* review notes, set apart from the page by a dashed edge */
.note{margin:18px 0 0;padding:12px 14px;border-radius:16px;border:1px dashed color-mix(in srgb,var(--ink) 26%,transparent);font:400 13px/1.5 var(--ui);color:var(--ink2)}
.note b{color:var(--ink);font-weight:600}
.note ul{margin:6px 0 0;padding-left:16px}
.note li + li{margin-top:3px}
.note table{width:100%;border-collapse:collapse;margin-top:6px}
.note td{padding:4px 6px 4px 0;vertical-align:top;border-top:1px solid var(--sep)}
.note td:first-child{color:var(--ink3);width:42%}

@media (prefers-reduced-motion:reduce){
  .novabtn .ring,.bigorb .ring,.glyph i,.spin,.skel,.bigorb .core,.menu{animation:none!important}
  .novabtn.listen .ring,.bigorb.listen .ring{opacity:.5}
}

<script>
(function(){
  const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
  const ico=(g,c)=>'<svg class="ic'+(c?' '+c:'')+'" aria-hidden="true"><use href="#i-'+g+'"/></svg>';
  const bars=(n)=>'<span class="glyph bars" aria-hidden="true">'+'<i></i>'.repeat(n||4)+'</span>';
  const dots='<span class="glyph dots" aria-hidden="true"><i></i><i></i><i></i></span>';

  /* ---------- the demo conversation (invented) ---------- */
  const SLEEP_H=[7.7,6.2,7.4,7.3,7.8,8.1,7.5];
  const sleepBars=(cls)=>'<div class="bars7 floor'+(cls?' '+cls:'')+'" role="img" aria-label="Sleep each night this week; Tuesday 6.2 hours, under the 7 hour line; the rest over it">'+
    SLEEP_H.map((h)=>'<i class="'+(h<7?'short':'')+'" style="height:'+Math.round((h-4)/4.5*100)+'%"></i>').join('')+'</div>'+
    '<div class="days7"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div>';
  const P={
    sleepPanel:'<button class="card panel" aria-label="Sleep this week. Tap to enlarge"><span class="pl">Sleep this week'+ico('expand')+'</span>'+sleepBars()+'<p class="pfoot">Tuesday 6.2 h, the one night under your 7 h line</p></button>',

   {n:'Turn',nova:'none',cls:'c-page',tally:'<b>C · Simplest, 1 Your turn.</b> One Nova, one line of what she heard, one line of what she said; here the line is the close, in the deck card · everything else is behind the pull · the dock’s Nova button grows into this orb on this page, so there is one talk control (and the dock is only the tab bar here: his call) · above the fold: <b>4 objects</b> · type <b>20 15 13</b> + numerals · floor <b>44</b> · resolves <b>1 3 4 5 6 7 8 11 12</b>',
    html:'<div class="cwrap"><p class="cstate rise" style="--i:0">'+ico('mic')+'Your turn · tap Nova</p><button class="bigorb talk rise" style="--i:1" aria-label="Talk to Nova"><span class="core"></span><span class="ring"></span><span class="ring r2"></span><span class="ring r3"></span></button>'+
     '<div class="clines rise" style="--i:2"><p class="heard"><b>You</b>Can we move pull day so it misses the dentist?</p><div style="margin-top:10px">'+T.decide()+'</div></div></div>'+fnNote('C')+
     '<div class="pull" data-obj role="button" aria-label="Pull up for the conversation, Brief me and more"><span class="grab"></span><span>Conversation, Brief me and more</span></div>'},
   {n:'Listen',nova:'none',cls:'c-page',tally:'<b>C · 2 Listening.</b> The orb rings outward; the words under it say so; the timer counts · tap the orb to send now · nothing else on screen',
    html:'<div class="cwrap"><p class="cstate rise" style="--i:0">'+bars()+'Listening · a pause sends · 0:07</p><button class="bigorb listen talk rise" style="--i:1" aria-label="Send now"><span class="core"></span><span class="ring"></span><span class="ring r2"></span><span class="ring r3"></span></button>'+
     '<div class="clines rise" style="--i:2"><p class="heard"><b>You</b>…</p><p class="line" style="color:var(--ink3)">Thursday is free after six. Shall I move it?</p></div></div>'+
     '<div class="pull" data-obj role="button" aria-label="Pull up for more"><span class="grab"></span><span>Conversation, Brief me and more</span></div>'},
   {n:'Think',nova:'none',cls:'c-page',tally:'<b>C · 3 Thinking.</b> The orb breathes; one line says what she is reading; his words above her place, and a skeleton where her line will be',
    html:'<div class="cwrap"><p class="cstate rise" style="--i:0">'+dots+'Reading your sleep log</p><button class="bigorb think rise" style="--i:1" aria-label="Talk to Nova"><span class="core"></span></button>'+
     '<div class="clines rise" style="--i:2"><p class="heard"><b>You</b>How did I sleep this week?</p><span class="skel" style="display:block;height:18px;width:86%;margin:12px 4px 0"></span><span class="skel" style="display:block;height:18px;width:60%;margin:8px 4px 0"></span></div></div>'+
     '<div class="pull" data-obj role="button" aria-label="Pull up for more"><span class="grab"></span><span>Conversation, Brief me and more</span></div>'},
   {n:'Speak',nova:'none',cls:'c-page',tally:'<b>C · 4 Speaking.</b> The orb steps back to 120 and swells with her voice; one panel rises between it and the lines (tap to open it full width); the spent ones wait in the pull · her sentence lit as she says it',
    html:'<div class="cwrap"><p class="cstate rise" style="--i:0">'+bars(3)+'Speaking · tap Nova to stop</p><button class="bigorb small speak rise" style="--i:1" aria-label="Stop and talk"><span class="core"></span><span class="ring"></span></button>'+
     '<div class="cpanel rise" style="--i:2">'+P.sleepPanel+'</div><div class="clines rise" style="--i:3;margin-top:14px"><p class="heard"><b>You</b>How did I sleep this week?</p><p class="line">Six of seven nights were over seven hours. <span class="later">Tuesday was the short one.</span></p></div></div>'+
     '<div class="pull" data-obj role="button" aria-label="Pull up for more"><span class="grab"></span><span>Conversation, Brief me and more</span></div>'},
   {n:'Failed',nova:'none',cls:'c-page',tally:'<b>C · 5 Failed.</b> The failure takes Nova’s line: what happened, the recording kept, Try again, Type it · the blocked-speech strip with ✕',
    html:'<div class="cwrap"><p class="cstate rise" style="--i:0">'+ico('mic')+'Your turn · tap Nova</p><button class="bigorb talk rise" style="--i:1" aria-label="Talk to Nova"><span class="core"></span></button>'+
     '<div class="clines rise" style="--i:2;text-align:left">'+failCard()+'</div></div>'+strip+
     '<div class="pull" data-obj role="button" aria-label="Pull up for more"><span class="grab"></span><span>Conversation, Brief me and more</span></div>'},
   {n:'Offline',nova:'none',cls:'c-page',tally:'<b>C · 6 Offline.</b> The orb goes grey and still; the row says why and offers Retry; her last line stays, labelled with its time',
    html:'<div class="cwrap"><p class="cstate rise" style="--i:0">'+ico('cloudoff')+'Offline · last reply 08:04</p><button class="bigorb off rise" style="--i:1" aria-label="Nova is offline" aria-disabled="true"><span class="core"></span></button>'+
     '<div class="clines rise" style="--i:2">'+offCard+'<p class="line stale">Six of seven nights were over seven hours.</p></div></div>'+
     '<div class="pull" data-obj role="button" aria-label="Pull up for more"><span class="grab"></span><span>Conversation, Brief me and more</span></div>'},
   {n:'Pull',nova:'none',cls:'',tally:'<b>C · 7 The pull.</b> One sheet holds everything the page does not show: the composer first, then Brief me, Let Nova learn you, Ambient, New chat as four buttons, the status and Hey Nova, then the thread in A’s grammar · the cost: every function that is not talking is one pull away, and the thread is a sheet',
    html:'<div class="behind"><div class="cwrap"><button class="bigorb"><span class="core"></span></button></div></div><div class="scrim"></div>'+
     '<div class="drawer open" data-obj><span class="grab"></span><button class="dhead"><span><b>Everything else</b></span>'+ico('downc')+'</button><div style="padding:0 8px">'+
     idleComposer.replace('class="composer"','class="composer" style="position:static;max-width:none;margin:0;padding:0;background:none;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none"')+
     '<div class="chips"><button class="qbtn">'+ico('brief')+'Brief me</button><button class="qbtn">'+ico('person')+'Let Nova learn you</button><button class="qbtn">'+ico('moon')+'Ambient</button><button class="qbtn">'+ico('compose')+'New chat</button></div>'+
     '<div class="card" style="margin-top:12px;padding:6px 0"><div class="stat">Microphone<span>Ready</span></div><div class="stat">Answers<span>Your vault, read-only</span></div><div class="stat">Spoken voice<span>Nova (default)</span></div><button class="swrow" role="switch" aria-checked="false">'+ico('mic')+'<span>“Hey Nova”</span><span class="sw" aria-hidden="true"></span></button></div>'+
     '<div class="thread">'+T.today+T.q1+T.a1+T.ev+T.acted+'</div></div></div>'}
  ]};

  /* ---------- the switcher (as mockup 58) ---------- */
  const phone=$('#phone');
  Object.keys(S).forEach((v)=>S[v].forEach((sc,i)=>{const m=document.createElement('main');m.id=v+(i+1);m.className='view'+(sc.cls?' '+sc.cls:'');m.hidden=true;m.dataset.tally=sc.tally;m.dataset.nova=sc.nova;m.innerHTML=sc.html;phone.appendChild(m);}));
  const sw=$('.switch'),scr=$('#screens'),tally=$('#tally'),nb=$('#novabtn'),dr=$('#dockrow');
  const setH=()=>document.documentElement.style.setProperty('--switch-h',(sw.offsetHeight-(parseFloat(getComputedStyle(sw).paddingTop)||0)+8)+'px');
  function renderTally(){const full=tally.dataset.full||'';
    if(tally.classList.contains('open')){tally.innerHTML=full+' <span class="tm">less</span>';return;}
    tally.innerHTML=full;if(tally.scrollWidth<=tally.clientWidth+1)return;
    const tmp=document.createElement('div');tmp.innerHTML=full;const words=tmp.textContent.split(' ');
    while(words.length>1){words.pop();tally.innerHTML=words.join(' ').replace(/[\s,.;:·]+$/,'')+'… <span class="tm">more</span>';if(tally.scrollWidth<=tally.clientWidth+1)break;}}
  tally.addEventListener('click',()=>{tally.classList.toggle('open');renderTally();setH();});
  let v='a',s=1;
  function apply(){
    const main=document.getElementById(v+s);
    $$('main.view').forEach((m)=>{m.hidden=m!==main;});
    $$('[data-var]').forEach((b)=>b.setAttribute('aria-pressed',String(b.dataset.var===v)));
    scr.innerHTML=S[v].map((x,i)=>'<button data-s="'+(i+1)+'" aria-pressed="'+(i+1===s)+'">'+x.n+'</button>').join('');
    tally.dataset.full=main.dataset.tally;tally.classList.remove('open');
    const st=main.dataset.nova;
    nb.className='novabtn'+(st==='talk'?' talk':st==='listen'?' talk listen':st==='speak'?' talk speak':st==='off'?' off':'');
    nb.style.display=st==='none'?'none':'';dr.classList.toggle('solo',st==='none');
    nb.setAttribute('aria-label',st==='listen'?'Send now':st==='speak'?'Stop Nova and talk':st==='off'?'Nova is offline':'Talk to Nova');
    history.replaceState(null,'','#'+v+'/'+s);
    try{localStorage.setItem('nova-voice-62',v+'/'+s);}catch(e){}
    renderTally();setH();
    $$('.rise',main).forEach((el)=>{el.style.animation='none';void el.offsetWidth;el.style.animation='';});
  }
  scr.addEventListener('click',(e)=>{const b=e.target.closest('[data-s]');if(!b)return;s=+b.dataset.s;window.scrollTo(0,0);apply();});
  $$('[data-var]').forEach((b)=>b.addEventListener('click',()=>{v=b.dataset.var;s=1;window.scrollTo(0,0);apply();}));
  function fromHash(){const h=(location.hash||'').replace('#','').toLowerCase();const p=h.split('/');if(!S[p[0]])return false;v=p[0];const n=+p[1];s=n>=1&&n<=S[v].length?n:1;return true;}
  window.addEventListener('hashchange',()=>{if(fromHash()){window.scrollTo(0,0);apply();}});
  window.addEventListener('resize',()=>{renderTally();setH();});
  if(!fromHash()){try{const p=(localStorage.getItem('nova-voice-62')||'').split('/');if(S[p[0]]){v=p[0];const n=+p[1];s=n>=1&&n<=S[v].length?n:1;}}catch(e){}}
  apply();
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{renderTally();setH();});
})();
</script>
