<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hayden's Wishlist</title>
<meta name="description" content="Things Hayden wants, kept up to date. Tap anything to see it in the shop.">
<meta name="theme-color" content="#efe8dc" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16130f" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<style>
:root {
  --ground: #efe8dc; --tile: #e4dccd; --ink: #201c17; --ink2: #5d554a; --ink3: #8a8174;
  --rule: rgba(32,28,23,.12); --star: #a9740f; --accent: #8f2f1d;
  --serif: "Newsreader", "Iowan Old Style", Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
  --out: cubic-bezier(.23, 1, .32, 1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #16130f; --tile: #231e18; --ink: #f1eadf; --ink2: #b3a998; --ink3: #82796b;
    --rule: rgba(241,234,223,.14); --star: #e0a93a; --accent: #e5805f; color-scheme: dark;
  }
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--ground); color: var(--ink); font: 400 15px/1.45 var(--sans); -webkit-font-smoothing: antialiased; }
a { color: inherit; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px; }

header { padding: calc(env(safe-area-inset-top) + 44px) 0 22px; }
.eyebrow { font: 500 12px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--ink3); margin: 0 0 14px; }
h1 { font: 400 clamp(40px, 9vw, 76px)/.98 var(--serif); letter-spacing: -.02em; margin: 0; font-optical-sizing: auto; }
h1 em { font-style: italic; color: var(--accent); }
.lede { margin: 16px 0 0; max-width: 34em; color: var(--ink2); font-size: 16px; }

/* the filter rail: the last chip is cut by the edge so it reads as "more" */
.rail { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--ground) 92%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--rule); }
.rail-in { display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x proximity; padding: 12px 16px; margin: 0 auto; max-width: 1120px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.rail-in::-webkit-scrollbar { display: none; }
.chip { flex: none; scroll-snap-align: start; font: 500 14px/1 var(--sans); padding: 11px 15px; min-height: 44px; border-radius: 999px; border: 1px solid var(--rule); background: transparent; color: var(--ink2); cursor: pointer; transition: background .18s var(--out), color .18s var(--out), border-color .18s var(--out); }
.chip small { font: 400 12px/1 var(--sans); color: var(--ink3); margin-left: 6px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--ground); border-color: var(--ink); }
.chip[aria-pressed="true"] small { color: color-mix(in srgb, var(--ground) 65%, transparent); }
.chip:focus-visible, .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.chip-more { border-style: dashed; }

main { padding: 28px 0 70px; min-height: 60vh; }
.sec + .sec { margin-top: 54px; }
.sec-h { display: flex; align-items: baseline; gap: 12px; margin: 0 0 16px; }
.sec-h h2 { font: 400 clamp(26px, 5vw, 36px)/1.05 var(--serif); letter-spacing: -.01em; margin: 0; }
.sec-h span { color: var(--ink3); font-size: 13px; }
.sec-note { margin: -8px 0 18px; color: var(--ink2); font-size: 14px; }

.grid { display: grid; gap: 22px 14px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (min-width: 640px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 30px 20px; } }
@media (min-width: 960px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.grid.big { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (min-width: 760px) { .grid.big { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 30px 24px; } }

.card { display: block; text-decoration: none; -webkit-tap-highlight-color: transparent; }
.pic { position: relative; aspect-ratio: 4 / 5; background: var(--tile); border-radius: 4px; overflow: hidden; display: grid; place-items: center; }
.pic img { width: 100%; height: 100%; object-fit: contain; padding: 8%; mix-blend-mode: multiply; transition: transform .5s var(--out); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .pic img { mix-blend-mode: normal; border-radius: 2px; } }
.pic .ph { font: 400 64px/1 var(--serif); color: var(--ink3); font-style: italic; padding: 16px; text-align: center; }
.stars { position: absolute; left: 8px; top: 8px; font: 500 13px/1 var(--sans); letter-spacing: .12em; color: var(--star); background: color-mix(in srgb, var(--ground) 86%, transparent); padding: 6px 7px 6px 9px; border-radius: 99px; }
.name { margin: 11px 0 0; font: 400 18px/1.2 var(--serif); letter-spacing: -.005em; text-wrap: balance; }
.meta { margin: 5px 0 0; font-size: 13px; color: var(--ink3); display: flex; gap: 8px; flex-wrap: wrap; }
.meta b { font-weight: 500; color: var(--ink2); }
.note { margin: 6px 0 0; font-size: 13px; color: var(--ink2); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-line; }
@media (hover: hover) { .card:hover .pic img { transform: scale(1.03); } .card:hover .name { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; } .chip:hover:not([aria-pressed="true"]) { border-color: var(--ink3); color: var(--ink); } }
.card:active .pic { opacity: .85; }

.sizes { margin: 0 0 26px; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
.sizes summary { cursor: pointer; padding: 14px 0; min-height: 44px; font: 500 14px/1.2 var(--sans); list-style: none; display: flex; justify-content: space-between; }
.sizes summary::-webkit-details-marker { display: none; }
.sizes summary::after { content: "+"; color: var(--ink3); }
.sizes[open] summary::after { content: "–"; }
.sizes dl { margin: 0 0 16px; display: grid; grid-template-columns: max-content 1fr; gap: 6px 22px; font-size: 14px; }
.sizes dt { color: var(--ink3); } .sizes dd { margin: 0; }

.state { padding: 60px 0; color: var(--ink2); max-width: 30em; }
.state strong { display: block; font: 400 26px/1.1 var(--serif); color: var(--ink); margin-bottom: 8px; }
.skel { aspect-ratio: 4/5; border-radius: 4px; background: linear-gradient(100deg, var(--tile) 30%, color-mix(in srgb, var(--tile) 55%, var(--ground)) 50%, var(--tile) 70%); background-size: 220% 100%; animation: sk 1.4s linear infinite; }
@keyframes sk { to { background-position: -220% 0; } }

footer { border-top: 1px solid var(--rule); padding: 22px 0 calc(env(safe-area-inset-bottom) + 30px); color: var(--ink3); font-size: 13px; }

.rise { animation: rise .55s var(--out) both; animation-delay: calc(var(--i, 0) * 28ms); }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } }
@media (prefers-reduced-motion: reduce) { .rise { animation: none; } .skel { animation: none; } .pic img { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">Hayden Cooper</p>
    <h1>Things I'd <em>love</em> to have</h1>
    <p class="lede">Kept up to date on its own. Tap anything to see it in the shop. The ones marked with stars are the ones I want most.</p>
  </header>
</div>
<nav class="rail" aria-label="Filter the list"><div class="rail-in" id="rail"></div></nav>
<main class="wrap" id="main" aria-live="polite">
  <div class="grid" aria-hidden="true">
    <div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div>
  </div>
</main>
<footer><div class="wrap" id="foot"></div></footer>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const MAX_CHIPS = 6;
  let data = null, filter = 'all', moreOpen = false;

  const ago = (iso) => {
    const m = Math.round((Date.now() - new Date(iso)) / 60000);
    if (!(m >= 0)) return 'just now';
    if (m < 2) return 'just now';
    if (m < 60) return m + ' minutes ago';
    const h = Math.round(m / 60);
    if (h < 24) return h + (h === 1 ? ' hour ago' : ' hours ago');
    return new Date(iso).toLocaleDateString(undefined, { day: 'numeric', month: 'long' });
  };
  const money = (n) => '$' + (Number.isInteger(n) ? n : n.toFixed(2));

  function card(it, i, big) {
    const pic = it.image ? `<img src="${esc(it.image)}" alt="" loading="${i < 8 ? 'eager' : 'lazy'}" decoding="async">` : `<span class="ph">${esc((it.name || '?').trim().charAt(0).toUpperCase())}</span>`;
    const stars = it.stars ? `<span class="stars" role="img" aria-label="${it.stars} of 3 stars, one of the things wanted most">${'★'.repeat(it.stars)}</span>` : '';
    const meta = [it.price != null ? `<b>${money(it.price)}</b>` : '', it.store ? esc(it.store.replace(/^www\./, '')) : ''].filter(Boolean).join('<span aria-hidden="true">·</span>');
    const tag = it.link ? 'a' : 'div';
    const href = it.link ? ` href="${esc(it.link)}" target="_blank" rel="noopener noreferrer"` : '';
    return `<${tag} class="card rise" style="--i:${Math.min(i, 14)}"${href}><div class="pic">${pic}${stars}</div><h3 class="name">${esc(it.name)}</h3>${meta ? `<p class="meta">${meta}</p>` : ''}${big && it.notes ? `<p class="note">${esc(it.notes)}</p>` : ''}</${tag}>`;
  }

  function counts(items) {
    const m = new Map();
    for (const it of items) for (const c of it.categories || []) m.set(c, (m.get(c) || 0) + 1);
    return [...m].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
  }

  function rail(items) {
    const cats = counts(items);
    const wanted = items.filter((i) => i.stars).length;
    const shown = moreOpen ? cats : cats.slice(0, MAX_CHIPS);
    const chip = (k, label, n) => `<button class="chip" data-f="${esc(k)}" aria-pressed="${filter === k}">${esc(label)}<small>${n}</small></button>`;
    $('rail').innerHTML = chip('all', 'Everything', items.length) + (wanted ? chip('top', 'Most wanted', wanted) : '') +
      shown.map(([c, n]) => chip('c:' + c, c, n)).join('') +
      (!moreOpen && cats.length > MAX_CHIPS ? `<button class="chip chip-more" data-more="1">${cats.length - MAX_CHIPS} more</button>` : '');
  }

  function render() {
    const items = data.items;
    rail(items);
    let list = items;
    if (filter === 'top') list = items.filter((i) => i.stars);
    else if (filter.startsWith('c:')) list = items.filter((i) => (i.categories || []).includes(filter.slice(2)));
    if (!list.length) { $('main').innerHTML = '<div class="state"><strong>Nothing here yet.</strong>Check back soon.</div>'; return; }

    const byStars = (a, b) => b.stars - a.stars || new Date(b.addedOn || 0) - new Date(a.addedOn || 0);
    const byNew = (a, b) => new Date(b.addedOn || 0) - new Date(a.addedOn || 0);
    let html = '';
    if (data.sizes && filter === 'all') {
      html += `<details class="sizes"><summary>Sizes, for anyone buying clothes</summary><dl>${Object.entries(data.sizes).map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc([].concat(v).join(' · '))}</dd>`).join('')}</dl></details>`;
    }
    if (filter === 'all') {
      const top = list.filter((i) => i.stars).sort(byStars), rest = list.filter((i) => !i.stars).sort(byNew);
      if (top.length) html += `<section class="sec"><div class="sec-h"><h2>Most wanted</h2><span>${top.length}</span></div><p class="sec-note">Three stars is the top of the list.</p><div class="grid big">${top.map((it, i) => card(it, i, true)).join('')}</div></section>`;
      if (rest.length) html += `<section class="sec"><div class="sec-h"><h2>Everything else</h2><span>${rest.length}</span></div><div class="grid">${rest.map((it, i) => card(it, i)).join('')}</div></section>`;
    } else {
      const title = filter === 'top' ? 'Most wanted' : filter.slice(2);
      html += `<section class="sec"><div class="sec-h"><h2>${esc(title)}</h2><span>${list.length}</span></div><div class="grid big">${list.sort(byStars).map((it, i) => card(it, i, true)).join('')}</div></section>`;
    }
    $('main').innerHTML = html;
    $('foot').textContent = `Updated ${ago(data.updatedAt)}. This page refreshes itself.`;
  }

  async function load(first) {
    try {
      const r = await fetch('data.json?t=' + Math.floor(Date.now() / 60000), { cache: 'no-cache' });
      if (!r.ok) throw new Error(r.status);
      const next = await r.json();
      const changed = !data || next.updatedAt !== data.updatedAt;
      data = next;
      if (changed || first) render(); else $('foot').textContent = `Updated ${ago(data.updatedAt)}. This page refreshes itself.`;
    } catch {
      if (!data) { $('rail').innerHTML = ''; $('main').innerHTML = '<div class="state"><strong>The list will not load.</strong>Check your connection and reload the page.</div>'; }
    }
  }

  document.addEventListener('click', (e) => {
    const b = e.target.closest('button.chip'); if (!b || !data) return;
    if (b.dataset.more) { moreOpen = true; rail(data.items); return; }
    filter = b.dataset.f; render(); window.scrollTo({ top: 0 });
  });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
  setInterval(load, 5 * 60000);
  load(true);
})();
</script>
</body>
</html>
