<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Nova core, icon render</title>
    <style>html,body{margin:0;background:transparent}#root{width:100vw;height:100vh;display:grid;place-items:center;overflow:hidden}</style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      if (navigator.serviceWorker && navigator.serviceWorker.controller) {
        navigator.serviceWorker.getRegistrations()
          .then((rs) => Promise.all(rs.map((r) => r.unregister())))
          .then(() => location.reload());
      }
    </script>
    <script type="module" src="./core.jsx"></script>
  </body>
</html>
